<div id="app">
  <header class="top">
    <h1>Endgames &amp; structures</h1>
    <p class="tagline">Positions with a known truth. Every move gets a verdict.</p>
  </header>

  <div class="eghead" id="eghead"></div>
  <div class="layout">
    <div class="sidecol">
      <div class="levels" id="levels"></div>
      <div class="levels" id="repsbox"></div>
      <nav class="chapters" id="chapters"></nav>
      <nav class="runs" id="runs"></nav>
    </div>

    <main class="stage">
      <div class="runbar" id="runbar" hidden>
        <span class="runname" id="runname"></span>
        <span class="runcount" id="runcount"></span>
        <button class="btn quiet tiny" id="btnQuit">Leave run</button>
      </div>

      <div class="boardwrap" id="boardwrap">
        <div class="board" id="board"></div>
        <div class="stamp" id="stamp"></div>
        <div class="veil" id="veil"><span id="veiltext">Finding a position</span></div>
      </div>

      <div class="statusbar" id="statusbar">
        <p class="prompt" id="prompt">Pick a chapter to begin.</p>
        <p class="verdict" id="verdict"></p>
      </div>

      <div class="controls" id="controls">
        <button id="btnNew" class="btn">New position</button>
        <button id="btnHint" class="btn quiet">Hint</button>
        <button id="btnBack" class="btn quiet" hidden>Take it back</button>
      </div>

      <div class="study" id="study" hidden>
        <p class="qtitle" id="qtitle"></p>
        <p class="qask" id="qask"></p>
        <div class="opts" id="opts"></div>
        <div class="why" id="why" hidden>
          <p id="whytext"></p>
          <button class="btn" id="btnNextQ">Next</button>
          <button class="btn quiet" id="btnPlayPlan" hidden>Play the plan</button>
        </div>
      </div>

      <div class="line" id="linepanel" hidden>
        <p class="lname" id="lname"></p>
        <p class="lsetup" id="lsetup"></p>
        <p class="lprompt" id="lprompt"></p>
        <p class="lnote" id="lnote"></p>
        <div class="lbtns">
          <button class="btn quiet" id="btnLineHint">Show the move</button>
          <button class="btn" id="btnLineNext" hidden>Next line</button>
        </div>
      </div>

      <div class="summary" id="summary" hidden>
        <h2 id="sumtitle"></h2>
        <ol class="sumlist" id="sumlist"></ol>
        <p class="sumtime" id="sumtime"></p>
        <button class="btn" id="btnDone">Back to the ladder</button>
      </div>
    </main>

    <aside class="sheet">
      <h2>Score sheet</h2>
      <ol class="moves" id="moves"></ol>
      <p class="empty" id="sheetEmpty">Your moves appear here as you play.</p>
    </aside>
  </div>

  <div class="promo" id="promo" hidden>
    <div class="promobox">
      <p>Promote to</p>
      <div class="promorow" id="promorow"></div>
    </div>
  </div>
</div>

<style>
  #app {
    --walnut: #000000;      /* page */
    --panel: #141414;       /* raised surfaces */
    --panel-2: #1E1E1E;     /* board frame */
    --maple: #EDEAE2;       /* light squares */
    --dark-sq: #3E6B4C;     /* dark squares, tournament green */
    --bone: #F4F3F0;        /* body text */
    --dim: #8C8C86;         /* secondary text */
    --sage: #56C878;        /* correct, best move */
    --amber: #FF8A1F;       /* every interaction accent */
    --rust: #E5484D;        /* blunders */
    --rule: #2B2B2B;        /* hairlines */

    /* One source of truth for board geometry. --sq subtracts the 7px frame on
       each side so a square is exactly what a piece has to fit inside. */
    --piece-w: #FFFFFF;     /* white piece fill */
    --piece-w-edge: #111111;
    --piece-b: #141414;     /* black piece fill */
    --piece-b-edge: #F0EDE6;

    --board: min(88vw, 580px);

    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    background: var(--walnut);
    color: var(--bone);
    padding: 28px 22px 40px;
    min-height: 100%;
    box-sizing: border-box;
    line-height: 1.5;
  }
  #app *, #app *::before, #app *::after { box-sizing: border-box; }
  #app [hidden] { display: none !important; }

  .top { max-width: 1260px; margin: 0 auto 26px; }
  .top h1 {
    font-size: 34px; font-weight: 600; margin: 0 0 5px;
    letter-spacing: 0.005em;
  }
  .tagline { margin: 0; color: var(--dim); font-size: 16.5px; font-style: italic; }

  .layout {
    max-width: 1260px; margin: 0 auto;
    display: grid; gap: 26px;
    grid-template-columns: 264px minmax(0, 1fr) 264px;
    align-items: start;
  }

  /* ---- chapters ---- */
  .chapters { display: flex; flex-direction: column; gap: 1px; }
  .grouphead {
    font-size: 15px; font-weight: 600; color: var(--amber);
    margin: 22px 0 7px 14px; font-style: italic;
  }
  .grouphead:first-child { margin-top: 0; }
  .chapter {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-left: 2px solid var(--rule);
    padding: 11px 16px; cursor: pointer; color: var(--bone);
    font: inherit; transition: background .15s, border-color .15s;
  }
  .chapter:hover:not(.locked) { background: var(--panel); }
  .chapter.on { border-left-color: var(--amber); background: var(--panel); }
  .chapter.locked { cursor: default; color: var(--dim); opacity: .55; }
  .chapter .num { font-size: 13px; color: var(--dim); }
  .chapter .name { font-size: 17.5px; margin: 1px 0 2px; }
  .chapter .meta { font-size: 13.5px; color: var(--dim); line-height: 1.45; }
  .chapter.locked .meta { font-style: italic; }
  .chapter:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .tally { color: var(--sage); }

  /* ---- difficulty ---- */
  .levels { margin-bottom: 24px; }
  .levelrow { display: flex; gap: 4px; padding: 0 16px; }
  .lvl {
    flex: 1; font: inherit; font-size: 16px; padding: 8px 0; cursor: pointer;
    background: var(--panel); color: var(--dim); border: 0;
    border-bottom: 2px solid var(--rule); transition: color .15s, background .15s;
  }
  .lvl:hover:not(.on) { color: var(--bone); background: var(--panel-2); }
  .lvl:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .lvl.on { background: var(--amber); color: #000; border-bottom-color: var(--amber); }
  .lvlname { font-size: 13.5px; color: var(--dim); margin: 9px 16px 0; line-height: 1.5; }
  .lvlname strong { color: var(--bone); font-weight: 600; }

  .unlockall {
    margin: 14px 16px 0; padding: 7px 0; width: calc(100% - 32px);
    font: inherit; font-size: 13.5px; font-style: italic; cursor: pointer;
    background: none; color: var(--dim); border: 0;
    box-shadow: inset 0 0 0 1px var(--rule); transition: color .15s;
  }
  .unlockall:hover { color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .unlockall:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---- runs ---- */
  .sidecol { display: flex; flex-direction: column; }
  .runs { display: flex; flex-direction: column; gap: 1px; margin-bottom: 22px; }
  .run {
    display: block; width: 100%; text-align: left;
    background: var(--panel); border: 0; border-left: 2px solid var(--rule);
    padding: 12px 16px; cursor: pointer; color: var(--bone); font: inherit;
    transition: border-color .15s, background .15s;
  }
  .run:hover { border-left-color: var(--amber); background: var(--panel-2); }
  .run:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .run .name { font-size: 17.5px; margin-bottom: 2px; }
  .run .meta { font-size: 13.5px; color: var(--dim); line-height: 1.45; }

  .runbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    width: var(--board); margin-bottom: 12px;
    border-bottom: 1px solid var(--rule); padding-bottom: 8px;
  }
  .runname { font-size: 15px; }
  .runcount { font-size: 13px; color: var(--dim); margin-left: auto; }
  .btn.tiny { font-size: 12.5px; padding: 4px 10px; }

  /* ---- study ---- */
  .study { width: var(--board); margin-top: 16px; }
  .qtitle { margin: 0 0 2px; font-size: 17px; }
  .qask { margin: 0 0 12px; font-size: 15px; color: var(--dim); font-style: italic; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    text-align: left; font: inherit; font-size: 14.5px; padding: 10px 13px;
    background: var(--panel); color: var(--bone); border: 0;
    border-left: 2px solid var(--rule); cursor: pointer; transition: border-color .15s;
  }
  .opt:hover:not(:disabled) { border-left-color: var(--amber); }
  .opt:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .opt:disabled { cursor: default; }
  .opt.right { border-left-color: var(--sage); color: var(--sage); }
  .opt.wrong { border-left-color: var(--rust); color: var(--rust); }
  .why { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .why p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; }

  /* ---- guided lines ---- */
  .line { width: var(--board); margin-top: 16px; }
  .lname { margin: 0 0 2px; font-size: 17px; }
  .lsetup { margin: 0 0 10px; font-size: 14px; color: var(--dim); font-style: italic;
            line-height: 1.55; }
  .lprompt { margin: 0 0 6px; font-size: 15.5px; }
  .lnote { margin: 0 0 12px; font-size: 14.5px; line-height: 1.6; min-height: 46px;
           color: var(--bone); }
  .lnote.miss { color: var(--amber); }
  .lnote.payoff { color: var(--sage); }
  .lbtns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- summary ---- */
  .summary { width: var(--board); }
  .summary h2 { font-size: 20px; font-weight: 600; margin: 0 0 14px; }
  .sumlist { list-style: none; margin: 0 0 14px; padding: 0; }
  .sumlist li {
    display: grid; grid-template-columns: 1fr auto; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 15px;
  }
  .sumtime { color: var(--dim); font-size: 14px; margin: 0 0 16px; }
  .dimmed { color: var(--dim); font-size: 13px; }

  /* ---- board ---- */
  .stage { display: flex; flex-direction: column; align-items: center; }
  .boardwrap { position: relative; width: var(--board); }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1; width: 100%;
    border: 7px solid var(--panel-2);
    box-shadow: 0 0 0 1px var(--rule), 0 12px 40px rgba(0,0,0,.8);
  }
  .sq {
    position: relative; display: flex; align-items: center; justify-content: center;
    cursor: default; user-select: none;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  .sq.light { background: var(--maple); }
  .sq.dark  { background: var(--dark-sq); }
  .sq.pickable { cursor: pointer; }
  .sq.sel::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 4px var(--amber);
  }
  .sq.target::before {
    content: ""; position: absolute; width: 26%; aspect-ratio: 1;
    border-radius: 50%; background: rgba(255,138,31,.72);
  }
  .sq.target.occupied::before {
    width: 100%; border-radius: 0; background: none;
    box-shadow: inset 0 0 0 5px rgba(255,138,31,.72);
  }
  .sq.from, .sq.to { background-image: linear-gradient(rgba(255,138,31,.30), rgba(255,138,31,.30)); }
  /* Drawn pieces, so size and centring no longer depend on a font's metrics. */
  .piece { width: 88%; height: 88%; pointer-events: none; }
  .piece svg { display: block; width: 100%; height: 100%; }
  .piece g {
    stroke-width: 5; stroke-linejoin: round;
    /* Stroke behind fill, so the outline haloes thin features instead of eating them. */
    paint-order: stroke fill;
  }
  .piece.w g { fill: var(--piece-w); stroke: var(--piece-w-edge); }
  .piece.b g { fill: var(--piece-b); stroke: var(--piece-b-edge); }
  .piece .detail { stroke: none; }
  .piece.w .detail { fill: #111; opacity: .30; }
  .piece.b .detail { fill: #F0EDE6; opacity: .40; }
  .coord {
    position: absolute; font-size: 10px; opacity: .75;
    bottom: 2px; right: 3px;
  }
  .sq.light .coord { color: #6F6C64; }
  .sq.dark  .coord { color: #A6C9B2; }

  .stamp {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--board) * 0.33); font-weight: 700; pointer-events: none; opacity: 0;
  }
  .stamp.go { animation: mark 1.15s ease-out forwards; }
  @keyframes mark {
    0%   { opacity: 0; transform: scale(.55) rotate(-13deg); }
    18%  { opacity: .95; transform: scale(1.06) rotate(-7deg); }
    30%  { transform: scale(1) rotate(-7deg); }
    70%  { opacity: .9; }
    100% { opacity: 0; transform: scale(1) rotate(-7deg); }
  }
  .stamp.best { color: var(--sage); }
  .stamp.slow { color: var(--amber); }
  .stamp.bad  { color: var(--rust); }

  .veil {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.88); color: var(--dim); font-style: italic;
  }
  .veil.on { display: flex; }

  /* ---- status ---- */
  .statusbar { width: var(--board); margin-top: 16px; min-height: 96px; }
  .prompt { margin: 0 0 5px; font-size: 18px; }
  .verdict { margin: 0; font-size: 16px; color: var(--dim); min-height: 24px; line-height: 1.55; }
  .verdict.best { color: var(--sage); }
  .verdict.slow { color: var(--amber); }
  .verdict.bad  { color: var(--rust); }
  .verdict.tip  { color: var(--bone); font-style: italic; line-height: 1.55; }
  .verdict.gone { color: var(--dim); }
  .verdict.done { color: var(--sage); font-size: 16px; }

  .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: inherit; font-size: 16px; padding: 10px 20px; cursor: pointer;
    background: var(--amber); color: #000; border: 0; transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.quiet { background: none; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rule); }
  .btn.quiet:hover { color: var(--bone); }
  .btn:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
  .btn[disabled] { opacity: .4; cursor: default; filter: none; }

  /* ---- score sheet ---- */
  .sheet h2 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 0 0 12px; }
  .moves { list-style: none; margin: 0; padding: 0; font-size: 16.5px; }
  .moves li {
    display: grid; grid-template-columns: 26px 1fr 1fr; gap: 6px;
    padding: 3px 0; border-bottom: 1px solid var(--rule);
    font-variant-numeric: tabular-nums;
  }
  .moves .no { color: var(--dim); font-size: 14.5px; }
  .ann { font-weight: 700; }
  .ann.best { color: var(--sage); }
  .ann.slow { color: var(--amber); }
  .ann.bad  { color: var(--rust); }
  .ann.gone { color: var(--dim); }
  .empty { color: var(--dim); font-size: 14.5px; font-style: italic; margin: 0; }

  /* ---- promotion ---- */
  .promo { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex;
           align-items: center; justify-content: center; z-index: 20; }
  .promobox { background: var(--panel); padding: 20px 24px; text-align: center; }
  .promobox p { margin: 0 0 12px; font-size: 15px; }
  .promorow { display: flex; gap: 6px; }
  .promorow button {
    width: 62px; height: 62px; cursor: pointer; padding: 4px;
    display: flex; align-items: center; justify-content: center;
    background: var(--maple); border: 0;
  }
  .promorow button:hover { filter: brightness(1.06); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0,1fr); }
    .stage { order: 1; }
    .sidecol { order: 2; }
    .sheet { order: 3; }
    .top { text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.go { animation: none; opacity: .9; }
  }
</style>

<script>
(function () {
  "use strict";

  var FILES = "abcdefgh";
  /* ---------- pieces ----------
     An original set drawn in a 100x100 box, all sitting on a common plinth.
     Heights differ on purpose: king tallest, pawn shortest, as in a real set.
     Unicode chess glyphs were sized inconsistently across fonts, which is why
     these are drawn rather than typed.                                       */
  var PIECE = {
    k:  // king
      "<path d=\"M46 6 h8 v8 h8 v7 h-8 v9 h-8 v-9 h-8 v-7 h8 z\"/>" +
      "<path d=\"M50 28 c-12 0 -20 6 -20 14 c0 5 3 9 7 12 h26 c4 -3 7 -7 7 -12 c0 -8 -8 -14 -20 -14 z\"/>" +
      "<path d=\"M28 54 h44 v8 h-44 z\"/>" +
      "<path d=\"M32 62 h36 c1 8 5 14 10 16 h-56 c5 -2 9 -8 10 -16 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    q:  // queen
      "<path d=\"M22 29 L28 52 L35 24 L42 50 L50 20 L58 50 L65 24 L72 52 L78 29 L74 62 L26 62 Z\"/>" +
      "<circle cx=\"22\" cy=\"29\" r=\"5\"/>" +
      "<circle cx=\"35\" cy=\"24\" r=\"5\"/>" +
      "<circle cx=\"50\" cy=\"20\" r=\"5.5\"/>" +
      "<circle cx=\"65\" cy=\"24\" r=\"5\"/>" +
      "<circle cx=\"78\" cy=\"29\" r=\"5\"/>" +
      "<path d=\"M28 62 h44 c1 8 3 13 6 16 h-56 c3 -3 5 -8 6 -16 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    r:  // rook
      "<path d=\"M25 22 h11 v9 h9 v-9 h10 v9 h9 v-9 h11 v22 h-50 z\"/>" +
      "<path d=\"M31 46 h38 l-3 26 h-32 z\"/>" +
      "<path d=\"M26 74 h48 v7 h-48 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    b:  // bishop
      "<circle cx=\"50\" cy=\"22\" r=\"4.5\"/>" +
      "<path d=\"M50 27 c-11 6 -17 15 -17 23 c0 6 4 11 9 13 h16 c5 -2 9 -7 9 -13 c0 -8 -6 -18 -17 -24 z\"/>" +
      "<path d=\"M43 55 l14 -21 l5 3 l-14 21 z\" class=\"detail\"/>" +
      "<path d=\"M34 63 h32 c1 7 4 13 8 18 h-48 c4 -5 7 -11 8 -18 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    n:  // knight
      "<path d=\"M60 16 l8 12 c8 10 10 24 10 53 h-42 c0 -16 4 -26 12 -34 l-10 4 c-6 2 -11 -1 -12 -6 c-1 -6 3 -10 8 -14 l14 -10 l4 -9 z\"/>" +
      "<circle cx=\"57\" cy=\"34\" r=\"3.5\" class=\"detail\"/>" +
      "<path d=\"M33 40 l9 -3 l-2 6 z\" class=\"detail\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    p:  // pawn
      "<circle cx=\"50\" cy=\"36\" r=\"12\"/>" +
      "<path d=\"M40 48 h20 l-3 6 c6 9 9 18 10 27 h-34 c1 -9 4 -18 10 -27 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
  };

  /* ---------- board helpers (index 0 = a8, 63 = h1) ---------- */
  function sqName(i) { return FILES[i % 8] + (8 - (i >> 3)); }
  function sqIndex(s) { return FILES.indexOf(s[0]) + (8 - parseInt(s[1], 10)) * 8; }
  function adjacent(a, b) {
    return Math.abs((a >> 3) - (b >> 3)) <= 1 && Math.abs((a % 8) - (b % 8)) <= 1;
  }

  function toFen(board, stm) {
    var rows = [];
    for (var r = 0; r < 8; r++) {
      var row = "", gap = 0;
      for (var f = 0; f < 8; f++) {
        var p = board[r * 8 + f];
        if (p) { if (gap) { row += gap; gap = 0; } row += p; } else { gap++; }
      }
      if (gap) row += gap;
      rows.push(row);
    }
    return rows.join("/") + " " + stm + " - - 0 1";
  }

  function applyUci(board, stm, uci) {
    var from = sqIndex(uci.slice(0, 2)), to = sqIndex(uci.slice(2, 4));
    var nb = board.slice();
    var piece = nb[from];
    if (uci.length > 4) piece = stm === "w" ? uci[4].toUpperCase() : uci[4].toLowerCase();
    nb[to] = piece; nb[from] = null;
    return nb;
  }

  function clearPath(board, from, to) {
    var sr = Math.sign((to >> 3) - (from >> 3)), sf = Math.sign((to % 8) - (from % 8));
    var r = (from >> 3) + sr, f = (from % 8) + sf;
    while (r !== (to >> 3) || f !== (to % 8)) {
      if (board[r * 8 + f]) return false;
      r += sr; f += sf;
    }
    return true;
  }

  function attacks(board, from, target) {
    var p = board[from];
    if (!p) return false;
    var t = p.toLowerCase(), white = p === p.toUpperCase();
    var dr = (target >> 3) - (from >> 3), df = (target % 8) - (from % 8);
    if (t === "k") return Math.abs(dr) <= 1 && Math.abs(df) <= 1 && (dr || df);
    if (t === "n") return (Math.abs(dr) === 1 && Math.abs(df) === 2) ||
                          (Math.abs(dr) === 2 && Math.abs(df) === 1);
    if (t === "p") return dr === (white ? -1 : 1) && Math.abs(df) === 1;
    if ((t === "r" || t === "q") && (dr === 0 || df === 0)) return clearPath(board, from, target);
    if ((t === "b" || t === "q") && Math.abs(dr) === Math.abs(df) && dr !== 0) return clearPath(board, from, target);
    return false;
  }

  function inCheck(board, color) {
    var king = color === "w" ? "K" : "k", ks = board.indexOf(king);
    if (ks < 0) return false;
    for (var i = 0; i < 64; i++) {
      var p = board[i];
      if (!p) continue;
      var isWhite = p === p.toUpperCase();
      if (isWhite === (color === "w")) continue;

  var PKEY = "endgame-reps-progress";

  function absorb(raw) {
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data && data.wins) {                     // current shape
      S.wins = Object.assign(S.wins, data.wins);
      if (data.level) S.level = data.level;
      if (data.reps !== undefined) S.reps = data.reps;
      if (data.freeAll) S.freeAll = true;
      if (data.seen) S.seen = data.seen;
      if (data.structs) S.structs = data.structs;
      if (data.runs) S.runs = data.runs;
    } else {                                     // saved before levels existed
      S.wins = Object.assign(S.wins, data);
    }
  }

  function loadProgress() {
    if (window.storage) {
      return window.storage.get(PKEY).then(function (r) {
        if (r && r.value) absorb(r.value);
      }).catch(function () {});
    }
    try { absorb(window.localStorage.getItem(PKEY)); }
    catch (e) { /* storage unavailable; nothing will persist */ }
    return Promise.resolve();
  }

  function saveProgress() {
    var blob = JSON.stringify({ wins: S.wins, level: S.level, reps: S.reps,
                            freeAll: S.freeAll, seen: S.seen, structs: S.structs, runs: S.runs });
    if (window.storage) { window.storage.set(PKEY, blob).catch(function () {}); return; }
    try { window.localStorage.setItem(PKEY, blob); } catch (e) {}
  }

  function setLevel(n) {
    if (n === S.level) return;
    S.level = n;
    saveProgress();
    renderLevels();
    if (S.mode === "drill" && S.ch) newPosition();   // reroll at the new difficulty
  }
  function unlocked(i) {
    if (S.freeAll || i === 0) return true;
    var prev = CHAPTERS[i - 1];
    return (S.wins[prev.id] || 0) >= prev.needed;
  }

  /* ---------- position generation ---------- */
  var PVAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

  /* A drill is pointless if the first move just wins a piece. The tablebase
     calls "Rxd1" a win like any other, so free material has to be filtered
     out here: neither side may be able to snap something off for nothing. */
  function quietPosition(board, stm) {
    var them = stm === "w" ? "b" : "w", i, hit;

    var ours = legalMoves({ b: board, stm: stm, cast: "", ep: -1 });
    for (i = 0; i < ours.length; i++) {
      hit = board[ours[i].to];
      if (!hit) continue;
      if (PVAL[hit.toLowerCase()] >= 3) return false;                 // a piece hangs
      if (!squareAttacked(board, ours[i].to, them)) return false;     // a loose pawn
    }

    var theirs = legalMoves({ b: board, stm: them, cast: "", ep: -1 });
    for (i = 0; i < theirs.length; i++) {
      hit = board[theirs[i].to];
      if (!hit) continue;
      if (!squareAttacked(board, theirs[i].to, stm)) return false;    // ours hangs to the reply
    }
    return true;
  }

  function legalSetup(board, stm) {
    if (!board) return false;
    var wk = board.indexOf("K"), bk = board.indexOf("k");
    if (wk < 0 || bk < 0 || adjacent(wk, bk)) return false;
    // Whoever is not to move cannot already be in check.
    return !inCheck(board, stm === "w" ? "b" : "w");
  }

  function findPosition(ch, gen) {
    var tries = 0, relax = 0, lv = currentLevel(), accept = acceptFor(ch, lv, 0);
    function attempt() {
      if (gen !== S.gen) throw new Error("superseded");   // don't keep hitting the API
      if (++tries > 90) throw new Error("no position after 90 tries");
      if (tries === 20 || tries === 45) {                 // nothing this strict exists here
        accept = acceptFor(ch, lv, ++relax);
        veil(true, "Widening the search\u2026");
      } else if (tries % 15 === 0) {
        veil(true, "Still searching\u2026");
      }
      var board = ch.place();
      if (!legalSetup(board, ch.stm)) return attempt();
      if (!quietPosition(board, ch.stm)) return attempt();
      return probe(toFen(board, ch.stm)).then(function (d) {
        if (!accept(d, board)) return attempt();
        return { board: board, data: d };
      }).catch(function (e) {
        // A 404 just means an illegal or out-of-table position; try another.
        if (String(e.message).indexOf("tablebase ") === 0) return attempt();
        throw e;
      });
    }
    return attempt();
  }

  /* ---------- flow ---------- */
  function veil(on, text) {
    el.veil.classList.toggle("on", !!on);
    if (text) el.veiltext.textContent = text;
  }

  function newPosition() {
    var ch = S.ch;
    if (!ch) return;
    var gen = ++S.gen;
    S.busy = true; S.over = false; S.sel = null; S.hinted = false; S.promoted = false;
    S.hintLevel = 0; S.hintsUsed = 0; S.lostIt = false;
    S.history = []; S.lastFrom = S.lastTo = null; S.snapshot = null;
    el.verdict.textContent = ""; el.verdict.className = "verdict";
    el.btnBack.hidden = true;
    el.prompt.textContent = ch.prompt;
    renderChapters(); renderSheet();
    veil(true, "Finding a position");

    findPosition(ch, gen).then(function (res) {
      if (gen !== S.gen) return;                 // the user moved on while we searched
      S.board = res.board; S.stm = ch.stm; S.tb = res.data;
      S.busy = false; veil(false); render();
    }).catch(function (err) {
      if (gen !== S.gen) return;
      var net = String(err.message).indexOf("tablebase ") !== 0 &&
                String(err.message).indexOf("no position") !== 0;
      veil(true, "No position");
      if (String(err.message).indexOf("no position") === 0) {
        el.prompt.textContent = "Couldn't find a position for this chapter.";
        el.verdict.textContent = "The filter for \u201c" + ch.title +
          "\u201d is too strict. Press New position to try again.";
      } else if (net && location.protocol === "file:") {
        el.prompt.textContent = "Opened as a file, so the browser blocked the lookup.";
        el.verdict.textContent = "A page loaded from file:// has a null origin and cannot call " +
          "outside hosts. Run  python -m http.server 8000  in this folder and open " +
          "http://localhost:8000/ instead.";
      } else if (net) {
        el.prompt.textContent = "Could not reach the tablebase.";
        el.verdict.textContent = "The request never left the browser \u2014 check your " +
          "connection, DNS, or any extension blocking tablebase.lichess.ovh.";
      } else {
        el.prompt.textContent = "The tablebase refused the request.";
        el.verdict.textContent = err.message + ". Press New position to retry.";
      }
      el.verdict.className = "verdict bad";
      S.busy = false;
    });
  }

  function stamp(kind, glyph) {
    el.stamp.className = "stamp";
    void el.stamp.offsetWidth;
    el.stamp.textContent = glyph;
    el.stamp.className = "stamp go " + kind;
  }

  // The API orders moves by DTZ, which is not always the fastest mate. For a
  // trainer, "quickest" should mean distance to mate, so pick that out ourselves.
  function speed(m) {
    if (m.dtm != null) return Math.abs(m.dtm);
    if (m.dtz != null) return Math.abs(m.dtz);
    return 0;
  }
  function fastestOf(moves) {
    var top = moves[0];
    var pool = moves.filter(function (m) { return norm(m.category) === norm(top.category); });
    if (!pool.length) return top;
    return pool.reduce(function (a, b) { return speed(b) < speed(a) ? b : a; }, pool[0]);
  }

  function play(mv) {
    var ch = S.ch, lv = currentLevel();
    var before = S.stm === ch.user ? norm(S.tb.category) : flip(norm(S.tb.category));
    var after = outcomeForMover(mv);
    var best = fastestOf(S.tb.moves);
    var kind, glyph, note;

    if (before === "loss") {
      // Nothing left to save. Grading a move here as "best" would be praise for
      // playing on in a position that was already gone.
      kind = "gone"; glyph = "";
      note = "The position was already lost.";
    } else if (rank(after) < rank(before)) {
      kind = "bad"; glyph = "\u2049";
      note = "That throws away the " + (before === "win" ? "win" : "draw") +
             ". " + best.san + " kept it.";
    } else if (after === "win" && speed(mv) > speed(best)) {
      kind = "slow"; glyph = "?!";
      note = "Still winning, but slow. " + best.san + " was quicker.";
    } else {
      kind = "best"; glyph = "!";
      note = S.hinted ? "Correct." : "Best move.";
    }

    S.snapshot = { board: S.board.slice(), stm: S.stm, tb: S.tb, len: S.history.length,
                   from: S.lastFrom, to: S.lastTo };

    // Throwing the result away ends the drill at every level. There is nothing
    // left to practise; the levels differ only in whether you may take it back.
    S.lostIt = (kind === "bad");

    el.verdict.textContent = note;
    el.verdict.className = "verdict " + kind;
    if (glyph) stamp(kind === "bad" ? "bad" : kind, kind === "bad" ? "??" : glyph);
    el.btnBack.hidden = (kind === "best") || !lv.takeback;

    commit(mv, kind);
  }

  function commit(mv, kind) {
    var gen = S.gen;
    S.busy = true; S.sel = null;
    if (mv.uci.length > 4) S.promoted = true;
    S.lastFrom = sqIndex(mv.uci.slice(0, 2));
    S.lastTo = sqIndex(mv.uci.slice(2, 4));
    S.board = applyUci(S.board, S.stm, mv.uci);
    S.stm = S.stm === "w" ? "b" : "w";
    S.history.push({ san: mv.san, ann: kind, by: S.ch.user });
    render(); renderSheet();

    probe(toFen(S.board, S.stm)).then(function (d) {
      if (gen !== S.gen) return;
      S.tb = d;
      if (S.lostIt) { endBlunder(); return; }
      if (finished(d)) return;
      setTimeout(function () { if (gen === S.gen) reply(); }, 480);
    }).catch(function (e) { if (gen === S.gen) fail(e); });
  }

  // At the top two levels a single bad move ends the drill there and then.
  // Called the moment the result is thrown away.
  function endBlunder() {
    S.lostIt = false; S.over = true; S.busy = false;
    var lv = currentLevel();
    el.prompt.textContent = (S.ch.goal === "draw" ? "The draw is gone." : "The win is gone.") +
      (lv.takeback ? " Take it back, or start a new position."
                   : " No take-backs at this level.");
    el.btnBack.hidden = !lv.takeback;
    render();
    runRecord(false);
  }

  /* ---------- how the opponent chooses ----------
     It is tablebase-perfect on the result and never blunders one away. But
     "perfect" usually leaves several moves tied, and how that tie is broken
     is the whole difference between looking sharp and looking aimless.      */
  function opponentMove(d, board, stm) {
    var moves = d.moves;
    var goal = outcomeForMover(moves[0]);          // the best result available to it
    var pool = moves.filter(function (m) { return outcomeForMover(m) === goal; });

    if (goal === "loss") {
      // Lost anyway, so drag the mate out as long as possible. This must use
      // distance to mate; the API orders by DTZ, which is a different thing.
      var slowest = pool.reduce(function (a, b) { return speed(b) > speed(a) ? b : a; }, pool[0]);
      pool = pool.filter(function (m) { return speed(m) === speed(slowest); });
    } else if (goal === "win") {
      var quickest = pool.reduce(function (a, b) { return speed(b) < speed(a) ? b : a; }, pool[0]);
      pool = pool.filter(function (m) { return speed(m) === speed(quickest); });
    } else if (pool.length > 1) {
      // Every move draws, so the tablebase has no opinion at all. Left to pick at
      // random it just shuffles. Push the pawn and walk at the enemy king instead,
      // so the defence actually gets tested.
      var foeKing = board.indexOf(stm === "w" ? "k" : "K");
      var top = [], bestScore = -Infinity;
      pool.forEach(function (m) {
        var from = sqIndex(m.uci.slice(0, 2)), to = sqIndex(m.uci.slice(2, 4));
        var piece = board[from] || "";
        var score = 0;
        if (piece.toLowerCase() === "p") score += 10;      // progress
        if (m.zeroing) score += 4;
        if (foeKing >= 0) score -= cheb(to, foeKing);      // close the distance
        if (score > bestScore) { bestScore = score; top = [m]; }
        else if (score === bestScore) top.push(m);
      });
      pool = top;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function reply() {
    var gen = S.gen, d = S.tb;
    if (!d.moves || !d.moves.length) { finished(d); return; }
    var mv = opponentMove(d, S.board, S.stm);

    S.lastFrom = sqIndex(mv.uci.slice(0, 2));
    S.lastTo = sqIndex(mv.uci.slice(2, 4));
    S.board = applyUci(S.board, S.stm, mv.uci);
    S.stm = S.stm === "w" ? "b" : "w";
    S.history.push({ san: mv.san, ann: null, by: S.ch.user === "w" ? "b" : "w" });
    render(); renderSheet();

    probe(toFen(S.board, S.stm)).then(function (d2) {
      if (gen !== S.gen) return;
      S.tb = d2;
      if (finished(d2)) return;
      S.busy = false; S.hinted = false; S.hintLevel = 0;
      el.btnBack.hidden = true;
      render();
    }).catch(function (e) { if (gen === S.gen) fail(e); });
  }

  // For "stop" chapters: the threat is gone only when the pawn is captured, not
  // when it promotes. A pawn that queens leaves the board too, so check both.
  function enemyThreatLeft() {
    var pawn = S.ch.user === "w" ? "p" : "P";
    var queen = S.ch.user === "w" ? "q" : "Q";
    return S.board.indexOf(pawn) !== -1 || S.board.indexOf(queen) !== -1;
  }

  function finished(d) {
    var ch = S.ch, msg = null, good = false;
    var mine = S.stm === ch.user ? norm(d.category) : flip(norm(d.category));

    if (d.checkmate) {
      good = S.stm !== ch.user;                       // the side to move is the one mated
      msg = good ? "Mate. Chapter complete." : "You were mated.";
    } else if (d.stalemate) {
      good = ch.goal === "draw";
      msg = good ? "Stalemate. The draw holds." : "Stalemate \u2014 the win is gone.";
    } else if (d.insufficient_material) {
      good = ch.goal === "draw" || ch.goal === "stop";
      msg = good ? "Nothing left to play for. Held." : "No mating material left.";
    } else if (ch.goal === "promote" && S.promoted) {
      good = mine === "win";
      msg = good ? "Queened, and still winning. That's the technique."
                 : "You queened, but the win had already gone.";
    } else if (ch.goal === "stop" && !enemyThreatLeft()) {
      good = mine !== "loss";
      msg = good ? "Threat gone." : "Pawn stopped, but the position is lost.";
    } else if (ch.goal === "draw" && S.history.length >= 28) {
      good = mine !== "loss";
      msg = good ? "Held. There's nothing left for the other side." : "The position is lost.";
    }

    if (!msg) return false;

    S.over = true; S.busy = false;
    el.prompt.textContent = msg;
    el.verdict.textContent = good ? "Press New position for another." : "Press New position to try again.";
    el.verdict.className = "verdict " + (good ? "done" : "bad");
    el.btnBack.hidden = true;
    if (good) {
      S.wins[ch.id] = (S.wins[ch.id] || 0) + 1;
      // Once a chapter is cleared, each new day's solve doubles the gap before it comes back.
      var sr = S.seen[ch.id] || {}, now = Date.now(); sr.lastWin = now; S.seen[ch.id] = sr;
      if (S.wins[ch.id] >= ch.needed) {
        if (!sr.last) sr.iv = 2;
        else if (now - sr.last > 12 * 3600e3) sr.iv = Math.min(45, Math.max(2, (sr.iv || 1) * 2));
        sr.last = now; S.seen[ch.id] = sr;
      }
      saveProgress();
    }
    renderChapters(); render();
    runRecord(good);
    return true;
  }

  function fail(err) {
    S.busy = false; S.over = true; S.sel = null;
    el.verdict.textContent = "Lost contact with the tablebase (" + err.message +
      "). Press New position to restart this drill.";
    el.verdict.className = "verdict bad";
    render();
  }

  function takeBack() {
    if (!S.snapshot) return;
    var s = S.snapshot;
    S.gen++;                         // kill the opponent reply already queued for this move
    S.board = s.board; S.stm = s.stm; S.tb = s.tb;
    S.history = S.history.slice(0, s.len);
    S.lastFrom = s.from; S.lastTo = s.to;
    S.snapshot = null; S.busy = false; S.over = false; S.sel = null;
    S.hintLevel = 0; S.hinted = false;
    el.btnBack.hidden = true;
    el.verdict.textContent = "Taken back. Try again.";
    el.verdict.className = "verdict";
    render(); renderSheet();
  }

  // How many moves keep the current result? Move categories are stated from the
  // opponent's seat, so anything matching the best move's category is equally good.
  function movesThatHold(tb) {
    var best = norm(tb.moves[0].category);
    return tb.moves.filter(function (m) { return norm(m.category) === best; }).length;
  }

  function adviceFor(ch, tb) {
    var bits = [ch.advice];
    var mine = norm(tb.category);
    var n = movesThatHold(tb);

    if (mine === "win") {
      bits.push(n === 1
        ? "Exactly one move keeps the win here."
        : n + " moves keep the win, though only some are quickest.");
    } else if (mine === "draw") {
      bits.push(n === 1
        ? "Exactly one move holds the draw here."
        : n + " moves hold the draw here.");
    }

    // Warn about stalemate only where it would be a disaster, not where it's the goal.
    if (ch.goal !== "draw" && tb.moves.some(function (m) { return m.stalemate; })) {
      bits.push("Careful \u2014 one of your moves is stalemate.");
    }
    return bits.join(" ");
  }

  function updateHintButton() {
    if (!currentLevel().hints) {
      el.btnHint.textContent = "Hints off"; el.btnHint.disabled = true; return;
    }
    if (S.hintLevel >= 2) { el.btnHint.textContent = "Move shown"; el.btnHint.disabled = true; return; }
    el.btnHint.disabled = S.busy || S.over || !S.tb;
    el.btnHint.textContent = S.hintLevel === 0 ? "Hint" : "Show the move";
  }

  function hint() {
    if (S.mode !== "drill" || !S.tb || !S.tb.moves || !S.tb.moves.length) return;
    if (S.busy || S.over || S.hintLevel >= 2 || !currentLevel().hints) return;

    S.hintLevel++;
    if (S.hintLevel === 1) {
      el.verdict.textContent = adviceFor(S.ch, S.tb);
      el.verdict.className = "verdict tip";
    } else {
      S.hinted = true;                       // only the move itself counts as being told
      S.hintsUsed++;
      el.verdict.textContent = "Play " + fastestOf(S.tb.moves).san + ".";
      el.verdict.className = "verdict slow";
    }
    updateHintButton();
  }

  /* ---------- runs ---------- */
  var SETS = [
    { id: "warmup", name: "Morning warm-up", blurb: "The three basic mates",
      drills: ["queenmate", "rookmate", "twobishops"] },
    { id: "pawnplay", name: "Pawn play", blurb: "The whole king-and-pawn group",
      drills: ["square", "keysquares", "opposition", "pawnwin", "distant",
               "holddraw", "seventh", "rookpawn", "triangulation", "corresponding"] },
    { id: "pawnwins", name: "Pawn play: winning", blurb: "Key squares, opposition, the seventh",
      drills: ["keysquares", "opposition", "pawnwin", "seventh"] },
    { id: "tempo", name: "Tempo and correspondence", blurb: "Locked pawns, king manoeuvring",
      drills: ["triangulation", "corresponding"] },
    { id: "pawndraws", name: "Pawn play: holding", blurb: "The square, opposition, rook pawns",
      drills: ["square", "distant", "holddraw", "rookpawn"] },
    { id: "stopping", name: "Stopping a runner", blurb: "Queen and rook against a pawn",
      drills: ["queenvspawn", "rookvspawn"] },
    { id: "rookschool", name: "Rook school", blurb: "Philidor, Lucena, and the rest",
      drills: ["philidor", "lucena", "rookpawngeneral"] },
    { id: "everything", name: "The whole ladder", blurb: "All thirteen, in order",
      drills: CHAPTERS.map(function (c) { return c.id; }) },
    { id: "structures", name: "Pawn structures", blurb: "Thirteen structures: a lesson, then a quiz",
      kind: "study" },
    { id: "structquiz", name: "Structures quiz", blurb: "Mixed questions from the ones you have learned",
      kind: "study", quiz: true },
    { id: "minority", name: "The minority attack", blurb: "Three model lines, move by move",
      kind: "line", lines: ["minority-direct", "minority-a5", "minority-a6"] },
    { id: "iqp-lines", name: "Playing the isolani", blurb: "Three ways to cash it in",
      kind: "line", lines: ["iqp-break", "iqp-e5", "iqp-blockade"] },
    { id: "maroczy-lines", name: "Breaking the bind", blurb: "Three model lines, as Black",
      kind: "line", lines: ["maroczy-b5", "maroczy-f5", "maroczy-c5"] },
    { id: "chain-lines", name: "Attacking a pawn chain", blurb: "Base, head, and wing play",
      kind: "line", lines: ["french-f5", "french-f6", "french-queenside"] }
  ];

  function chapterById(id) {
    for (var i = 0; i < CHAPTERS.length; i++) if (CHAPTERS[i].id === id) return CHAPTERS[i];
    return null;
  }

  /* ---------- pawn structures ----------
     No tablebase reaches these, so they are graded on doctrine rather than
     calculation: name the plan the structure calls for.                      */
  var STRUCTURES = [
    {
      name: "The Carlsbad",

      options: [

      ],

    },
    {

      fen: "8/pp3ppp/4p3/8/2PP4/8/P4PPP/8",
      ask: "Black piles up against the c4/d4 pair. What is Black trying to provoke?",
      options: [

      if (!ownedBy(p, stm)) continue;
      var t = p.toLowerCase(), f = i % 8, r = i >> 3;

      if (t === "p") {
        var step = stm === "w" ? -1 : 1;              // row 0 is rank 8
        var startRow = stm === "w" ? 6 : 1;
        var promoRow = stm === "w" ? 0 : 7;
        if (onBoard(f, r + step) && !b[(r + step) * 8 + f]) {
          pushPawn(out, i, (r + step) * 8 + f, promoRow);
          if (r === startRow && !b[(r + 2 * step) * 8 + f]) {
            out.push({ from: i, to: (r + 2 * step) * 8 + f, promo: null });
          }
        }
        [-1, 1].forEach(function (df) {
          var nf = f + df, nr = r + step;
          if (!onBoard(nf, nr)) return;
          var to = nr * 8 + nf, tp = b[to];
          if ((tp && isWhite(tp) !== (stm === "w")) || to === pos.ep) {
            pushPawn(out, i, to, promoRow);
          }
        });

      } else if (t === "n" || t === "k") {
        (t === "n" ? KNIGHT : STAR).forEach(function (d) {
          var nf = f + d[0], nr = r + d[1];
          if (!onBoard(nf, nr)) return;
          var to = nr * 8 + nf;
          if (!ownedBy(b[to], stm)) out.push({ from: i, to: to, promo: null });
        });

      } else {
        var dirs = t === "b" ? DIAG : t === "r" ? ORTH : STAR;
        dirs.forEach(function (d) {
          var nf = f + d[0], nr = r + d[1];
          while (onBoard(nf, nr)) {
            var to = nr * 8 + nf;
            if (ownedBy(b[to], stm)) break;
            out.push({ from: i, to: to, promo: null });
            if (b[to]) break;
            nf += d[0]; nr += d[1];
          }
        });
      }
    }

    // Castling: rights, empty path, and the king may not start, cross, or land in check.
    var home = stm === "w" ? 7 : 0, kingSq = home * 8 + 4;
    var rights = stm === "w" ? ["K", "Q"] : ["k", "q"];
    if (b[kingSq] === (stm === "w" ? "K" : "k") && !squareAttacked(b, kingSq, stm === "w" ? "b" : "w")) {
      if (pos.cast.indexOf(rights[0]) >= 0 && !b[kingSq + 1] && !b[kingSq + 2] &&
          !squareAttacked(b, kingSq + 1, stm === "w" ? "b" : "w")) {
        out.push({ from: kingSq, to: kingSq + 2, promo: null, castle: 1 });
      }
      if (pos.cast.indexOf(rights[1]) >= 0 && !b[kingSq - 1] && !b[kingSq - 2] && !b[kingSq - 3] &&
          !squareAttacked(b, kingSq - 1, stm === "w" ? "b" : "w")) {
        out.push({ from: kingSq, to: kingSq - 2, promo: null, castle: -1 });
      }
    }
    return out;
  }

  // Applies a move and returns the new position, handling rook shuffles,
  // en-passant captures, and the rights each move gives up.
  function makeMove(pos, mv) {
    var b = pos.b.slice(), piece = b[mv.from], t = piece.toLowerCase();
    var stm = pos.stm, ep = -1, cast = pos.cast;

    if (t === "p" && mv.to === pos.ep) {                    // en passant
      b[(mv.from >> 3) * 8 + (mv.to % 8)] = null;
    }
    b[mv.to] = mv.promo ? (stm === "w" ? mv.promo.toUpperCase() : mv.promo) : piece;
    b[mv.from] = null;

    if (mv.castle) {                                        // move the rook too
      var row = mv.from >> 3;
      if (mv.castle > 0) { b[row * 8 + 5] = b[row * 8 + 7]; b[row * 8 + 7] = null; }
      else { b[row * 8 + 3] = b[row * 8 + 0]; b[row * 8 + 0] = null; }
    }
    if (t === "p" && Math.abs((mv.to >> 3) - (mv.from >> 3)) === 2) {
      ep = ((mv.from >> 3) + (mv.to >> 3)) / 2 * 8 + (mv.from % 8);
    }
    if (t === "k") cast = cast.replace(stm === "w" ? /[KQ]/g : /[kq]/g, "");
    [[56, "Q"], [63, "K"], [0, "q"], [7, "k"]].forEach(function (c) {
      if (mv.from === c[0] || mv.to === c[0]) cast = cast.replace(c[1], "");
    });

    return { b: b, stm: stm === "w" ? "b" : "w", cast: cast, ep: ep };
  }

  function legalMoves(pos) {
    var enemy = pos.stm === "w" ? "b" : "w";
    return pseudoMoves(pos).filter(function (mv) {
      var next = makeMove(pos, mv);
      return !squareAttacked(next.b, kingOf(next.b, pos.stm), enemy);
    });
  }

  function moveUci(mv) {
    return sqName(mv.from) + sqName(mv.to) + (mv.promo || "");
  }

    L = { line: line, pos: parsePos(line.fen), i: 0, wrong: 0 };
    L.you = L.pos.stm;
    S.board = L.pos.b; S.ch = null; S.tb = null; S.sel = null;
    S.lastFrom = S.lastTo = null; S.history = [];
    renderRunbar();
    el.lname.textContent = line.title;
    el.lsetup.textContent = line.setup;
    el.lnote.textContent = "";
    el.lnote.className = "lnote";
    el.btnLineHint.disabled = false;
    el.btnLineHint.textContent = "Show the move";
    renderSheet(); render();
    lineAsk();
  }

  function lineAsk() {
    if (!L.line.moves[L.i]) return;
    el.lprompt.textContent = (L.you === "w" ? "White" : "Black") +
                             " to play. Find the plan move.";
  }

  function lineClick(sq) {
    if (S.mode !== "line" || !L || L.done) return;
    var legal = legalMoves(L.pos);
    if (L.sel !== null && L.sel !== undefined) {
      var picked = legal.filter(function (m) {
        return m.from === L.sel && m.to === sq;
      });
      if (picked.length) { tryLineMove(picked[0]); return; }
    }
    L.sel = ownedBy(L.pos.b[sq], L.pos.stm) ? sq : null;
    render();
  }

  function tryLineMove(mv) {
    var want = L.line.moves[L.i];
    var got = moveUci(mv);
    // Accept any promotion spelling if the line's move is not a promotion.
    if (got !== want.uci && got.slice(0, 4) !== want.uci.slice(0, 4)) {
      L.wrong++;
      L.sel = null;
      el.lnote.className = "lnote miss";
      el.lnote.textContent = L.wrong >= 2
        ? "Still not it. The plan move is " + want.san + "."
        : "That is legal, but it is not the plan. Think about which pawn has to move, and why.";
      render();
      return;
    }
    playLineMove(want, mv);
  }

  function playLineMove(entry, mv) {
    L.pos = makeMove(L.pos, mv);
    S.board = L.pos.b;
    S.lastFrom = mv.from; S.lastTo = mv.to;
    S.history.push({ san: entry.san, ann: L.wrong ? "slow" : "best", by: L.you });
    L.sel = null; L.wrong = 0;
    el.lnote.className = "lnote";
    el.lnote.textContent = entry.note || "";
    L.i++;
    renderSheet(); render();

    if (entry.last || L.i >= L.line.moves.length) { finishLine(); return; }

    // Black answers with the line's reply.
    var reply = L.line.moves[L.i];
    setTimeout(function () {
      if (S.mode !== "line" || !L) return;
      var legal = legalMoves(L.pos);
      var m = legal.filter(function (x) { return moveUci(x) === reply.uci; })[0];
      if (!m) { el.lprompt.textContent = "This line is broken at " + reply.san + "."; return; }
      L.pos = makeMove(L.pos, m);
      S.board = L.pos.b;
      S.lastFrom = m.from; S.lastTo = m.to;
      S.history.push({ san: reply.san, ann: null, by: L.you === "w" ? "b" : "w" });
      L.i++;
      renderSheet(); render(); lineAsk();
    }, 620);
  }

  function finishLine() {
    L.done = true;
    el.lprompt.textContent = "Plan complete.";
    el.lnote.className = "lnote payoff";
    el.lnote.textContent = L.line.payoff;
    var clean = S.history.every(function (h) { return h.ann !== "slow"; });
    RUN.results[RUN.i] = { label: L.line.title, good: clean, tally: null };
    el.btnLineHint.disabled = true;
    el.btnLineNext.hidden = false;
    el.btnLineNext.textContent =
      (RUN.i + 1 >= RUN.set.lines.length) ? "See how you did" : "Next line";
    render();
  }

  function nextLine() {
    el.btnLineNext.hidden = true;
    if (RUN.i + 1 >= RUN.set.lines.length) { showSummary(); return; }
    RUN.i++;
    loadLine(RUN.i);
  }

  function lineHint() {
    if (!L || L.done) return;
    var want = L.line.moves[L.i];
    el.lnote.className = "lnote miss";
    el.lnote.textContent = "Play " + want.san + ".";
    L.wrong = Math.max(L.wrong, 1);
    el.btnLineHint.disabled = true;
  }

  /* ---------- mode switching ---------- */
  function setMode(m) {
    S.mode = m;
    el.boardwrap.hidden = (m === "summary");
    el.statusbar.hidden = (m !== "drill");
    el.controls.hidden = (m !== "drill");
    el.study.hidden = (m !== "study");
    el.linepanel.hidden = (m !== "line");
    el.summary.hidden = (m !== "summary");
  }

  /* ---------- run state ---------- */
  var RUN = null;

  function startRun(set) {
    RUN = { set: set, i: 0, results: [], started: Date.now(), order: null, queue: set.kind === "study" ? studyQueue(set) : null };
    renderRunbar();
    if (set.kind === "study") { showQuestion(); return; }
    if (set.kind === "line") { startLines(set.lines); return; }
    setMode("drill");                      // we may be arriving from a summary or a study run
    S.ch = chapterById(set.drills[0]);
    newPosition();
  }

  function renderRunbar() {
    if (!RUN) { el.runbar.hidden = true; return; }
    el.runbar.hidden = false;
    el.runname.textContent = RUN.set.name;
    if (RUN.set.endless) {
      el.runcount.textContent = "position " + (RUN.i + 1);
      el.btnQuit.textContent = "Finish";
      return;
    }
    var total = RUN.set.kind === "study" ? RUN.queue.length
              : RUN.set.kind === "line" ? RUN.set.lines.length
              : RUN.set.drills.length;
    el.runcount.textContent = (RUN.i + 1) + " of " + total;
    el.btnQuit.textContent = "Leave run";
  }

  function quitRun() {
    RUN = null; L = null;
    S.gen++;                               // drop anything the run had in flight
    el.runbar.hidden = true;
    setMode("drill");
    S.ch = null; S.tb = null; S.board = new Array(64).fill(null);
    S.history = []; S.sel = null; S.lastFrom = S.lastTo = null;
    S.busy = false; S.over = false;
    el.prompt.textContent = "Pick a chapter or a run to begin.";
    el.verdict.textContent = ""; el.verdict.className = "verdict";
    el.btnBack.hidden = true;
    veil(false);
    renderChapters(); renderSheet(); render();
  }

  // Called by finished() once a drill resolves.
  function runRecord(good) {
    if (!RUN || RUN.set.kind === "study" || RUN.set.kind === "line") return;
    var run = RUN;                         // so a mid-timeout run change can't advance the wrong one
    var solo = run.set.kind === "solo";
    var tally = { best: 0, slow: 0, bad: 0, hints: S.hintsUsed };
    S.history.forEach(function (m) { if (m.ann && tally[m.ann] !== undefined) tally[m.ann]++; });
    run.results[run.i] = { label: solo ? "Rep " + (run.i + 1) : S.ch.title,
                           good: good, tally: tally };
    if (!good) return;                     // stay put; New position retries this one

    if (solo) {
      if (run.set.reps && run.i + 1 >= run.set.reps) {
        setTimeout(function () { if (RUN === run) showSummary(); }, 1400);
        return;
      }
      setTimeout(function () {
        if (RUN !== run) return;
        run.i++;
        renderRunbar();
        newPosition();                     // same chapter, fresh position
      }, 1400);
      return;
    }
    if (run.i + 1 >= run.set.drills.length) {
      setTimeout(function () { if (RUN === run) showSummary(); }, 1400);
      return;
    }
    setTimeout(function () {
      if (RUN !== run) return;
      run.i++;
      renderRunbar();
      S.ch = chapterById(run.set.drills[run.i]);
      newPosition();
    }, 1400);
  }

  /* ---------- study mode ----------
     The course takes two structures at a time, lesson first, then its questions,
     and finishes with a couple of review questions from ones already learned.
     The quiz mixes questions from everything learned so far.                 */
  function shuffled(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function studyQueue(set) {
    var learned = STRUCTURES.filter(function (x) { return S.structs[x.name]; });
    var qOf = function (st) { return st.qs.map(function (q) { return { kind: "q", s: st, q: q }; }); };
    if (set.quiz) {
      var pool = (learned.length >= 3 ? learned : STRUCTURES).reduce(function (a, st) { return a.concat(qOf(st)); }, []);
      return shuffled(pool).slice(0, 8);
    }
    // New structures first, in order; then the ones you scored worst on, longest ago.
    var score = function (st) { var r = S.structs[st.name]; return r ? (r.right / Math.max(1, r.n)) * 10 + (r.last / 864e5) / 1e6 : -1; };
    var next = STRUCTURES.filter(function (x) { return !S.structs[x.name]; });
    if (next.length < 2) next = next.concat(learned.slice().sort(function (a, b) { return score(a) - score(b); }));
    next = next.slice(0, 2);
    var out = [];
    next.forEach(function (st) { out.push({ kind: "lesson", s: st }); out = out.concat(qOf(st)); });
    var rest = learned.filter(function (x) { return next.indexOf(x) < 0; });
    shuffled(rest).slice(0, 2).forEach(function (st) { out.push({ kind: "q", s: st, q: st.qs[Math.floor(Math.random() * st.qs.length)], review: true }); });
    return out;
  }
  function showQuestion() {
    var item = RUN.queue[RUN.i], st = item.s;
    S.gen++;                                   // cancel anything the last drill has in flight
    setMode("study");
    veil(false);
    S.board = fromFen(st.fen);
    S.ch = null; S.sel = null; S.tb = null;
    S.lastFrom = S.lastTo = null; S.history = [];
    render(); renderSheet();
    renderRunbar();

    el.qtitle.textContent = (item.review ? "Review: " : "") + st.name;
    el.btnPlayPlan.hidden = true;
    el.opts.innerHTML = "";

    if (item.kind === "lesson") {
      var L = st.lesson;
      el.qask.textContent = st.from + ".";
      el.whytext.innerHTML = '<span class="lsn"><b>The idea.</b> ' + L.idea + '</span>' +
        '<span class="lsn"><b>White’s plan.</b> ' + L.white + '</span>' +
        '<span class="lsn"><b>Black’s plan.</b> ' + L.black + '</span>' +
        '<span class="lsn"><b>Watch for.</b> ' + L.watch + '</span>';
      el.why.hidden = false;
      el.btnNextQ.textContent = "Quiz me on it";
      var avail = linesFor(st.name);
      el.btnPlayPlan.hidden = avail.length === 0;
      if (avail.length) el.btnPlayPlan.textContent = "Watch the plan (" + avail.length + " lines)";
      return;
    }
    var q = item.q;
    el.qask.textContent = q.ask;
    el.why.hidden = true;

    // Shuffle, or the correct answer's position becomes the answer.
    var order = shuffled(q.options.map(function (_, i) { return i; }));
    RUN.order = order;

    order.forEach(function (orig) {
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = q.options[orig];
      b.addEventListener("click", function () { answerQuestion(orig); });
      el.opts.appendChild(b);
    });
  }

  function answerQuestion(picked) {
    var item = RUN.queue[RUN.i], q = item.q, order = RUN.order;
    var buttons = el.opts.querySelectorAll(".opt");
    for (var slot = 0; slot < buttons.length; slot++) {
      buttons[slot].disabled = true;
      var orig = order[slot];
      if (orig === q.answer) buttons[slot].className = "opt right";
      else if (orig === picked) buttons[slot].className = "opt wrong";
    }
    var good = picked === q.answer;
    RUN.results.push({ label: (item.review ? "Review: " : "") + item.s.name, good: good, tally: null });
    var r = S.structs[item.s.name] || (S.structs[item.s.name] = { n: 0, right: 0, last: 0 });
    r.n++; if (good) r.right++; r.last = Date.now(); saveProgress();
    el.whytext.textContent = q.why;
    el.why.hidden = false;
    el.btnNextQ.textContent = (RUN.i + 1 >= RUN.queue.length) ? "See how you did" : "Next";

    var avail = linesFor(item.s.name);
    el.btnPlayPlan.hidden = avail.length === 0;
    if (avail.length) {
      el.btnPlayPlan.textContent = "Play the plan (" + avail.length + " lines)";
    }
  }

  function nextQuestion() {
    if (RUN.i + 1 >= RUN.queue.length) return showSummary();
    RUN.i++;
    showQuestion();
  }

  /* ---------- summary ---------- */
  function showSummary() {
    if (!RUN) return;
    S.runs[RUN.set.name] = Date.now(); saveProgress(); renderRuns();
    setMode("summary");
    var clean = 0;
    el.sumtitle.textContent = RUN.set.name;
    el.sumlist.innerHTML = "";
    RUN.results.forEach(function (r) {
      var li = document.createElement("li");
      var name = document.createElement("span");
      name.textContent = r.label;
      var mark = document.createElement("span");
      if (r.tally) {
        var bits = [];
        if (r.tally.best) bits.push('<span class="ann best">!</span>\u00d7' + r.tally.best);
        if (r.tally.slow) bits.push('<span class="ann slow">?!</span>\u00d7' + r.tally.slow);
        if (r.tally.bad) bits.push('<span class="ann bad">??</span>\u00d7' + r.tally.bad);
        if (r.tally.hints) bits.push('<span class="dimmed">' + r.tally.hints + " shown</span>");
        mark.innerHTML = bits.join("  ") || "\u2014";
        if (!r.tally.bad && !r.tally.slow && !r.tally.hints) clean++;
      } else {
        mark.innerHTML = r.good
          ? '<span class="ann best">right</span>'
          : '<span class="ann bad">wrong</span>';
        if (r.good) clean++;
      }
      li.appendChild(name); li.appendChild(mark);
      el.sumlist.appendChild(li);
    });
    var mins = Math.max(1, Math.round((Date.now() - RUN.started) / 60000));
    var lv = currentLevel();
    if (RUN.set.solo) el.sumtitle.textContent = RUN.set.name + ", " + RUN.results.length +
      (RUN.results.length === 1 ? " position" : " positions");
    el.sumtime.textContent = clean + " of " + RUN.results.length +
      " clean, in about " + mins + (mins === 1 ? " minute" : " minutes") +
      (RUN.set.kind === "study" || RUN.set.kind === "line"
        ? "." : ", at level " + lv.n + " (" + lv.name + ").");
  }

  /* ---------- interaction ---------- */
  function isUsers(piece) {
    if (!piece) return false;
    return (piece === piece.toUpperCase()) === (S.ch.user === "w");
  }

  function onSquare(sq) {
    if (S.mode !== "drill" || !S.ch) return;
    if (!S.tb || S.busy || S.over || S.stm !== S.ch.user) return;
    var legal = S.tb.moves || [];
    if (S.sel !== null) {
      var matches = legal.filter(function (m) {
        return sqIndex(m.uci.slice(0, 2)) === S.sel && sqIndex(m.uci.slice(2, 4)) === sq;
      });
      if (matches.length === 1) return play(matches[0]);
      if (matches.length > 1) return askPromotion(matches);
    }
    S.sel = isUsers(S.board[sq]) ? sq : null;
    render();
  }

  function askPromotion(matches) {
    el.promorow.innerHTML = "";
    matches.forEach(function (m) {
      var letter = m.uci[4] || "q";
      var b = document.createElement("button");
      b.title = m.san;
      b.appendChild(pieceEl(S.ch.user === "w" ? letter.toUpperCase() : letter));
      b.addEventListener("click", function () { el.promo.hidden = true; play(m); });
      el.promorow.appendChild(b);
    });
    el.promo.hidden = false;
  }

  /* ---------- rendering ---------- */
  function pieceEl(p) {
    var d = document.createElement("div");
    d.className = "piece " + (p === p.toUpperCase() ? "w" : "b");
    d.innerHTML = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
                  "<g>" + PIECE[p.toLowerCase()] + "</g></svg>";
    return d;
  }

  function render() {
    var live = S.mode === "drill" && !!S.ch;
    var online = S.mode === "line" && !!L && !L.done;
    var flipBoard = (live && S.ch.user === "b") || (online && L.you === "b");
    var sel = online ? L.sel : S.sel;
    var targets = [];

    if (live && S.sel !== null) {
      targets = ((S.tb && S.tb.moves) || [])
        .filter(function (m) { return sqIndex(m.uci.slice(0, 2)) === S.sel; })
        .map(function (m) { return sqIndex(m.uci.slice(2, 4)); });
    } else if (online && sel !== null && sel !== undefined) {
      targets = legalMoves(L.pos)
        .filter(function (m) { return m.from === sel; })
        .map(function (m) { return m.to; });
    }

    el.board.innerHTML = "";
    for (var n = 0; n < 64; n++) {
      var i = flipBoard ? 63 - n : n;
      var d = document.createElement("div");
      var light = (((i >> 3) + (i % 8)) % 2) === 0;
      d.className = "sq " + (light ? "light" : "dark");
      if (i === S.lastFrom) d.className += " from";
      if (i === S.lastTo) d.className += " to";
      if (i === sel) d.className += " sel";
      if (targets.indexOf(i) !== -1) d.className += " target" + (S.board && S.board[i] ? " occupied" : "");

      var p = S.board ? S.board[i] : null;
      if (p) {
        d.appendChild(pieceEl(p));
        if (live && isUsers(p) && !S.busy && !S.over && S.stm === S.ch.user) d.className += " pickable";
        if (online && ownedBy(p, L.pos.stm)) d.className += " pickable";
      }
      if ((live || online) && targets.indexOf(i) !== -1) d.className += " pickable";

      if (n >= 56 || n % 8 === 7) {
        var c = document.createElement("span");
        c.className = "coord";
        c.textContent = sqName(i);
        d.appendChild(c);
      }
      (function (idx) {
        d.addEventListener("click", function () {
          if (S.mode === "line") lineClick(idx); else onSquare(idx);
        });
      })(i);
      el.board.appendChild(d);
    }
    updateHintButton();
  }

  function renderLevels() {
    el.levels.innerHTML = "";
    var h = document.createElement("h2");
    h.className = "grouphead";
    h.textContent = "Difficulty";
    el.levels.appendChild(h);

    var row = document.createElement("div");
    row.className = "levelrow";
    LEVELS.forEach(function (lv) {
      var b = document.createElement("button");
      b.className = "lvl" + (lv.n === S.level ? " on" : "");
      b.textContent = lv.n;
      b.title = lv.name;
      b.addEventListener("click", function () { setLevel(lv.n); });
      row.appendChild(b);
    });
    el.levels.appendChild(row);

    var p = document.createElement("p");
    p.className = "lvlname";
    p.innerHTML = "<strong>" + currentLevel().name + "</strong><br>" + currentLevel().blurb;
    el.levels.appendChild(p);
  }

  var REPS = [1, 3, 5, 10, 0];             // 0 means keep going until you leave




  function renderReps() {
    el.repsbox.innerHTML = "";
    var h = document.createElement("h2");
    h.className = "grouphead";
    h.textContent = "Repeats";
    el.repsbox.appendChild(h);

    var row = document.createElement("div");
    row.className = "levelrow";
    REPS.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "lvl" + (n === S.reps ? " on" : "");
      b.textContent = n === 0 ? "\u221e" : String(n);
      b.title = n === 0 ? "Keep going until you stop" : n + " in a row";
      b.addEventListener("click", function () { setReps(n); });
      row.appendChild(b);
    });
    el.repsbox.appendChild(row);

    var p = document.createElement("p");
    p.className = "lvlname";
    p.textContent = S.reps === 0
      ? "Pick a chapter below and it repeats until you stop."
      : S.reps === 1
        ? "Pick a chapter below for one position at a time."
        : "Pick a chapter below and it repeats " + S.reps + " times.";
    el.repsbox.appendChild(p);
  }

  function renderRuns() {
    el.runs.innerHTML = "";
    var h = document.createElement("h2");
    h.className = "grouphead";
    h.textContent = "Runs";
    el.runs.appendChild(h);
    SETS.forEach(function (set) {
      var b = document.createElement("button");
      b.className = "run";
      var count = set.kind === "study" ? 0
                : set.kind === "line" ? set.lines.length : set.drills.length;
      var learned = STRUCTURES.filter(function (x) { return S.structs[x.name]; }).length;
      b.innerHTML = '<div class="name">' + set.name + '</div>' +
                    '<div class="meta">' + set.blurb + (set.kind === "study"
                      ? ", " + learned + " of " + STRUCTURES.length + " learned"
                      : ", " + count + " in a row") + "</div>";
      b.addEventListener("click", function () { startRun(set); });
      el.runs.appendChild(b);
    });
  }

  var DAY = 864e5;
  function dueList() {
    var now = Date.now();
    return CHAPTERS.filter(function (c) {
      if ((S.wins[c.id] || 0) < c.needed) return false;
      var r = S.seen[c.id]; return !r || !r.last || now - r.last >= (r.iv || 2) * DAY;
    });
  }
  function chapterButton(ch, i, opts) {
    var open = unlocked(i), done = S.wins[ch.id] || 0, cleared = done >= ch.needed;
    var b = document.createElement("button");
    b.className = "chapter" + (open ? "" : " locked") + (S.ch === ch ? " on" : "") + (cleared ? " cleared" : "");
    b.disabled = !open;
    var chip, sub;
    if (opts && opts.due) { chip = '<span class="chip due">Review</span>'; sub = ch.material; }
    else if (!open) {
      var prev = CHAPTERS[i - 1], left = prev.needed - (S.wins[prev.id] || 0);
      chip = '<span class="chip lock">Locked</span>';
      sub = "Opens after " + left + " more " + prev.title.replace(/^The /, "").toLowerCase() + (left === 1 ? "" : "s");
    } else if (cleared) {
      var r = S.seen[ch.id], next = r && r.last ? Math.max(0, Math.ceil((r.last + (r.iv || 2) * DAY - Date.now()) / DAY)) : 0;
      chip = '<span class="chip ok">✓ Cleared</span>'; sub = next ? "Next review in " + next + (next === 1 ? " day" : " days") : "Due for review";
    } else { chip = '<span class="chip">' + done + " / " + ch.needed + "</span>"; sub = ch.material; }
    var pctDone = Math.min(100, Math.round(100 * done / ch.needed));
    b.innerHTML = '<div class="crow"><span class="num">' + (i + 1) + '</span><span class="name">' + ch.title + '</span>' + chip + '</div>' +
                  '<div class="meta">' + sub + '</div>' +
                  (open && !cleared ? '<div class="pbar"><i style="width:' + pctDone + '%"></i></div>' : '');
    if (open) b.addEventListener("click", function () { startChapter(ch); });
    return b;
  }
  function renderChapters() {
    var cleared = CHAPTERS.filter(function (c) { return (S.wins[c.id] || 0) >= c.needed; }).length;
    var due = dueList();
    if (el.eghead) el.eghead.innerHTML =
      '<div><p class="egeyebrow">Endgames &amp; structures</p><h2 class="egtitle">' +
      (due.length ? due.length + (due.length === 1 ? " chapter is" : " chapters are") + " due for review" : cleared ? "You are up to date" : "Start with the queen mate") + '</h2>' +
      '<p class="egsub">Cleared chapters come back after 2, 4, 8 days and so on, so the technique stays automatic. Your daily plan brings them in too.</p></div>' +
      '<div class="egstats"><div><b>' + cleared + '<small> / ' + CHAPTERS.length + '</small></b><span>chapters cleared</span></div><div><b>' + due.length + '</b><span>due today</span></div></div>';

    el.chapters.innerHTML = "";
    if (due.length) {
      var dh = document.createElement("h2"); dh.className = "grouphead due"; dh.textContent = "Due for review";
      el.chapters.appendChild(dh);
      due.forEach(function (ch) { el.chapters.appendChild(chapterButton(ch, CHAPTERS.indexOf(ch), { due: true })); });
    }
    var lastGroup = null;
    CHAPTERS.forEach(function (ch, i) {
      if (ch.group !== lastGroup) {
        lastGroup = ch.group;
        var h = document.createElement("h2");
        h.className = "grouphead";
        h.textContent = ch.group;
        el.chapters.appendChild(h);
      }
      el.chapters.appendChild(chapterButton(ch, i));
    });
    if (!S.freeAll && CHAPTERS.some(function (c, i) { return !unlocked(i); })) {
      var free = document.createElement("button");
      free.className = "unlockall";
      free.textContent = "Unlock every chapter";
      free.title = "Skip the ladder and drill anything you like";
      free.addEventListener("click", unlockAll);
      el.chapters.appendChild(free);
    }
  }

  function renderSheet() {
    el.moves.innerHTML = "";
    el.sheetEmpty.hidden = S.history.length > 0;
    var whiteFirst = (S.mode === "line" && L) ? L.you === "w"
                   : (S.ch ? S.ch.stm === "w" : true);
    var cells = S.history.slice();
    if (!whiteFirst) cells.unshift(null);
    for (var i = 0; i < cells.length; i += 2) {
      var li = document.createElement("li");
      var no = document.createElement("span");
      no.className = "no"; no.textContent = (i / 2 + 1) + ".";
      li.appendChild(no);
      [cells[i], cells[i + 1]].forEach(function (m) {
        var s = document.createElement("span");
        if (m) {
          s.textContent = m.san;
          if (m.ann) {
            var a = document.createElement("span");
            a.className = "ann " + m.ann;
            a.textContent = m.ann === "best" ? "!"
                          : m.ann === "slow" ? "?!"
                          : m.ann === "gone" ? "\u00b7" : "??";
            s.appendChild(a);
          }
        } else { s.textContent = "\u2026"; }
        li.appendChild(s);
      });
      el.moves.appendChild(li);
    }
  }


  function setReps(n) {
    if (n === S.reps) return;
    S.reps = n;
    saveProgress();
    renderReps();
  }

  // Picking one chapter drills that chapter, repeatedly. Handing the run engine a
  // list that is the same chapter N times means the counter, auto-advance and
  // summary all work with no special cases.
  function startChapter(ch, reps) {
    reps = (reps === undefined) ? S.reps : reps;
    RUN = null;
    setMode("drill");
    S.ch = ch;

    if (reps === 1) { el.runbar.hidden = true; newPosition(); return; }

    var endless = (reps === 0), list = [];
    for (var i = 0; i < (endless ? 1 : reps); i++) list.push(ch.id);
    RUN = { set: { id: "solo:" + ch.id, name: ch.title, kind: "solo",
                   drills: list, endless: endless, solo: true },
            i: 0, results: [], started: Date.now() };
    renderRunbar();
    newPosition();
  }

  function unlockAll() {
    S.freeAll = true;
    saveProgress();
    renderChapters();
  }


  el.btnNew.addEventListener("click", function () {
    if (!S.ch) S.ch = CHAPTERS[0];
    setMode("drill");
    newPosition();
  });
  el.btnHint.addEventListener("click", hint);
  el.btnBack.addEventListener("click", takeBack);
  el.btnQuit.addEventListener("click", function () {
    if (RUN && RUN.set.endless && RUN.results.length) showSummary(); else quitRun();
  });
  el.btnNextQ.addEventListener("click", nextQuestion);
  el.btnDone.addEventListener("click", quitRun);
  el.btnLineHint.addEventListener("click", lineHint);
  el.btnLineNext.addEventListener("click", nextLine);
  el.btnPlayPlan.addEventListener("click", function () {
    var q = RUN.queue[RUN.i].s;
    var ids = linesFor(q.name).map(function (l) { return l.id; });
    if (ids.length) startLines(ids);
  });
  el.promo.addEventListener("click", function (e) {
    if (e.target === el.promo) el.promo.hidden = true;
  });

  loadProgress().then(function () {
    renderLevels(); renderReps(); renderRuns(); renderChapters(); renderSheet(); render();
    setMode("drill");
    startChapter(CHAPTERS[0], 1);
  });
})();
</script>
