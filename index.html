<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pawnstorm</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one shell, five tabs. The opening tabs put the board left and a notebook panel right; Endgames is the original trainer, untouched. */
:root {
  --walnut: #000000; --panel: #141414; --panel-2: #1E1E1E; --maple: #EDEAE2; --dark-sq: #3E6B4C;
  --bone: #F4F3F0; --dim: #8C8C86; --sage: #56C878; --amber: #FF8A1F; --rust: #E5484D; --rule: #2B2B2B;
  --piece-w: #FFFFFF; --piece-w-edge: #111111; --piece-b: #141414; --piece-b-edge: #F0EDE6;
  --board: min(calc(100vw - 32px), 540px);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  color-scheme: dark;
}
html, body { background: var(--walnut); }
[hidden] { display: none !important; }
body { color: var(--bone); font-family: var(--serif); font-size: 16px; line-height: 1.5; }
.shell { max-width: 1260px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
.shell *, .shell *::before, .shell *::after { box-sizing: border-box; }
.shell-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 24px; margin-bottom: 18px; }
.shell-top h1 { font-size: 34px; font-weight: 600; margin: 0 0 5px; letter-spacing: .005em; }
.shell-top .tagline { margin: 0; color: var(--dim); font-size: 16.5px; font-style: italic; }
.shell-top .grow { flex: 1; }
.sidepick { display: flex; gap: 4px; }
.sidepick button { font: inherit; font-size: 15px; padding: 7px 16px; cursor: pointer; background: var(--panel); color: var(--dim); border: 0; border-bottom: 2px solid var(--rule); }
.sidepick button:hover { color: var(--bone); }
.sidepick button[aria-pressed="true"] { background: var(--amber); color: #000; border-bottom-color: var(--amber); }
.shell-tabs { display: flex; flex-wrap: wrap; gap: 2px 22px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; }
.shell-tabs button { font: inherit; font-size: 17px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 8px 0; margin-bottom: -1px; cursor: pointer; }
.shell-tabs button:hover { color: var(--bone); }
.shell-tabs button[aria-selected="true"] { color: var(--bone); border-bottom-color: var(--amber); }
.shell-tabs .count { font-size: 13px; color: var(--amber); margin-left: 5px; font-variant-numeric: tabular-nums; }
.shell button:focus-visible, .shell a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-2); color: var(--bone); box-shadow: 0 0 0 1px var(--rule); padding: 10px 18px; font-family: var(--serif); font-size: 15px; z-index: 30; max-width: calc(100% - 32px); }
#app { padding: 0 !important; min-height: 0 !important; background: none !important; }
</style>
<style>
#rw .grid { display: grid; grid-template-columns: var(--board) minmax(0, 1fr); gap: 32px; align-items: start; }

@media (max-width: 900px) { #rw .grid { grid-template-columns: minmax(0, 1fr); justify-items: center; }
 #rw .panel { width: 100%; max-width: var(--board); }
 }


/* ---- board, drawn the same way as the endgame trainer ---- */
#rw .boardwrap { width: var(--board); max-width: 100%; }

#rw .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; width: 100%; border: 7px solid var(--panel-2); box-shadow: 0 0 0 1px var(--rule), 0 12px 40px rgba(0,0,0,.8); }

#rw .sq { position: relative; display: flex; align-items: center; justify-content: center; user-select: none; min-width: 0; min-height: 0; overflow: hidden; border: 0; padding: 0; font: inherit; cursor: default; }

#rw .sq.light { background: var(--maple); }

#rw .sq.dark { background: var(--dark-sq); }

#rw .sq.pickable { cursor: pointer; }

#rw .sq.sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--amber); }

#rw .sq.hint::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--sage); }

#rw .sq.target::before { content: ""; position: absolute; width: 26%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,138,31,.72); }

#rw .sq.target.occupied::before { width: 100%; border-radius: 0; background: none; box-shadow: inset 0 0 0 5px rgba(255,138,31,.72); }

#rw .sq.from, #rw .sq.to { background-image: linear-gradient(rgba(255,138,31,.30), rgba(255,138,31,.30)); }

#rw .piece { width: 88%; height: 88%; pointer-events: none; }

#rw .piece svg { display: block; width: 100%; height: 100%; }

#rw .piece g { stroke-width: 5; stroke-linejoin: round; paint-order: stroke fill; }

#rw .piece.w g { fill: var(--piece-w); stroke: var(--piece-w-edge); }

#rw .piece.b g { fill: var(--piece-b); stroke: var(--piece-b-edge); }

#rw .piece .detail { stroke: none; }

#rw .piece.w .detail { fill: #111; opacity: .30; }

#rw .piece.b .detail { fill: #F0EDE6; opacity: .40; }

#rw .coord { position: absolute; font-size: 10px; opacity: .75; bottom: 2px; right: 3px; pointer-events: none; }

#rw .coord.rank { bottom: auto; right: auto; top: 2px; left: 3px; }

#rw .sq.light .coord { color: #6F6C64; }

#rw .sq.dark .coord { color: #A6C9B2; }

#rw .boardbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }

#rw .boardbar .grow { flex: 1; }

#rw .store { font-size: 13px; color: var(--dim); font-style: italic; }


#rw .btn { font: inherit; font-size: 15px; padding: 8px 16px; cursor: pointer; background: var(--amber); color: #000; border: 0; transition: filter .15s; }

#rw .btn:hover { filter: brightness(1.08); }

#rw .btn.quiet { background: none; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rule); }

#rw .btn.quiet:hover { color: var(--bone); }

#rw .btn.tiny { font-size: 13px; padding: 4px 10px; }

#rw .btn.danger { color: var(--rust); }

#rw .btn:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }

#rw .btn[disabled] { opacity: .4; cursor: default; filter: none; }


/* ---- panel ---- */
#rw .panel { display: flex; flex-direction: column; gap: 26px; min-width: 0; }

#rw .sec h2 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 0 0 10px; }

#rw .sec h3 { font-size: 21px; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }

#rw .sec .ask { margin: 0 0 12px; font-size: 15px; color: var(--dim); font-style: italic; max-width: 60ch; }

#rw .who { font-size: 15px; font-style: italic; }

#rw .who.mine { color: var(--amber); }

#rw .who.theirs { color: var(--dim); }


#rw .moveline { display: flex; flex-wrap: wrap; gap: 2px 2px; align-items: baseline; font-size: 16.5px; font-variant-numeric: tabular-nums; }

#rw .moveline .no { color: var(--dim); font-size: 14.5px; margin-left: 6px; }

#rw .moveline .no:first-child { margin-left: 0; }

#rw .moveline button { font: inherit; background: none; border: 0; color: var(--bone); padding: 1px 4px; cursor: pointer; }

#rw .moveline button:hover { color: var(--amber); }

#rw .moveline button.cur { background: var(--amber); color: #000; }


#rw .list { display: flex; flex-direction: column; gap: 1px; margin: 0; padding: 0; list-style: none; }

#rw .item { display: flex; align-items: center; gap: 12px; background: var(--panel); border-left: 2px solid var(--rule); padding: 9px 14px; min-width: 0; }

#rw .item:hover { border-left-color: var(--amber); }

#rw .item.on { border-left-color: var(--amber); }

#rw .item .go { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; background: none; border: 0; padding: 0; text-align: left; color: var(--bone); font: inherit; cursor: pointer; }

#rw .item .san { font-size: 17.5px; min-width: 4.2ch; }

#rw .item .meta { font-size: 13.5px; color: var(--dim); line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }

#rw .item .meter { width: 64px; height: 4px; background: var(--rule); flex: none; align-self: center; }

#rw .item .meter i { display: block; height: 100%; background: var(--amber); }

#rw .tag { font-size: 13px; font-style: italic; white-space: nowrap; }

#rw .tag.ok { color: var(--sage); }

#rw .tag.gap { color: var(--rust); }

#rw .tag.warn { color: var(--amber); }

#rw .tag.dim { color: var(--dim); }

#rw .empty { color: var(--dim); font-size: 14.5px; font-style: italic; margin: 0; padding: 6px 0; }


#rw textarea, #rw input[type="text"] { font: inherit; font-size: 15px; color: var(--bone); background: var(--panel); border: 0; box-shadow: inset 0 0 0 1px var(--rule); padding: 9px 11px; min-width: 0; }

#rw textarea { width: 100%; min-height: 110px; resize: vertical; font-size: 14px; }

#rw textarea:focus, #rw input[type="text"]:focus { outline: 2px solid var(--amber); outline-offset: 0; }

#rw input[type="file"] { font: inherit; font-size: 14px; color: var(--dim); max-width: 100%; }

#rw .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

#rw .note { font-size: 13.5px; color: var(--dim); font-style: italic; }

#rw details.sec summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--dim); }

#rw details.sec[open] summary { margin-bottom: 10px; }


#rw .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; }

#rw .stat { background: var(--panel); padding: 12px 14px; }

#rw .stat b { display: block; font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }

#rw .stat span { font-size: 13px; color: var(--dim); }

@media (max-width: 480px) { #rw .stats { grid-template-columns: minmax(0, 1fr); }
 }


#rw .gaps { display: flex; flex-direction: column; gap: 1px; }

#rw .gapi { background: var(--panel); border-left: 2px solid var(--rule); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; }

#rw .gapi.t-opp, #rw .gapi.t-nomove { border-left-color: var(--rust); }

#rw .gapi.t-dev { border-left-color: var(--amber); }

#rw .gapi.t-short { border-left-color: var(--dim); }

#rw .gapi .after { font-size: 16.5px; overflow-wrap: anywhere; }

#rw .gapi .played { font-size: 14.5px; color: var(--bone); }

#rw .gapi .played b { font-weight: 600; color: var(--amber); }

#rw .gapi .sub { font-size: 13.5px; color: var(--dim); }

#rw .gapi .act { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

#rw .gapi .num { font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }

#rw .gapi .num small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); }


#rw .lnote { margin: 0; font-size: 15px; line-height: 1.6; min-height: 48px; color: var(--bone); }

#rw .lnote.miss { color: var(--amber); }

#rw .lnote.bad { color: var(--rust); }

#rw .lnote.payoff { color: var(--sage); }

#rw .moves { list-style: none; margin: 0; padding: 0; font-size: 16.5px; }

#rw .moves li { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }

#rw .moves .no { color: var(--dim); font-size: 14.5px; }

#rw .ann { font-weight: 700; }

#rw .ann.best { color: var(--sage); }

#rw .ann.slow { color: var(--amber); }

#rw .ann.bad { color: var(--rust); }


/* ---- today ---- */
#rw .today { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px; align-items: start; }

@media (max-width: 900px) { #rw .today { grid-template-columns: minmax(0, 1fr); }
 }

#rw .plan, #rw .coach { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

#rw .eyebrow { margin: 0 0 -14px; font-size: 14px; color: var(--amber); font-style: italic; }

#rw .plantitle { font-size: 30px; font-weight: 600; margin: 0; }

#rw .plan > .ask { margin: -8px 0 0; font-size: 16.5px; max-width: 62ch; }

#rw .progress { position: relative; display: flex; gap: 14px; align-items: baseline; padding-bottom: 10px; font-size: 15px; }

#rw .progress::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--rule); }

#rw .progress i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--amber); z-index: 1; transition: width .3s; }

#rw .tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }

#rw .task { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: start; background: var(--panel); border-left: 2px solid var(--rule); padding: 14px 16px; }

#rw .task:hover { border-left-color: var(--amber); }

#rw .task.done { border-left-color: var(--sage); }

#rw .task.done .ttitle { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--rule); }

#rw .tick { width: 30px; height: 30px; border: 0; box-shadow: inset 0 0 0 1px var(--dim); background: none; color: #000; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }

#rw .tick:hover { box-shadow: inset 0 0 0 2px var(--amber); }

#rw .tick[aria-pressed="true"] { background: var(--sage); box-shadow: none; }

#rw .tick[disabled] { cursor: default; }

#rw .thead { display: flex; gap: 10px; align-items: baseline; }

#rw .tkind { font-size: 13px; font-style: italic; color: var(--amber); }

#rw .tkind.k-tactics { color: #E8B04A; }
 #rw .tkind.k-openings { color: var(--amber); }
 #rw .tkind.k-endgames { color: #7FB8E0; }

#rw .tkind.k-play { color: var(--sage); }
 #rw .tkind.k-review { color: #C79BE0; }
 #rw .tkind.k-setup { color: var(--dim); }

#rw .tmins { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }

#rw .ttitle { font-size: 18px; margin: 2px 0 4px; overflow-wrap: anywhere; }

#rw .twhy { margin: 0; font-size: 14.5px; color: var(--dim); line-height: 1.55; }

#rw .tact { padding-top: 4px; }

#rw .tact a.btn { text-decoration: none; display: inline-block; white-space: nowrap; }

@media (max-width: 560px) { #rw .task { grid-template-columns: 34px minmax(0, 1fr); }
 #rw .tact { grid-column: 2; padding-top: 0; }
 }

#rw .setsec { display: flex; flex-direction: column; gap: 12px; }

#rw .setrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

#rw .setrow > .note { min-width: 7.5em; }

#rw .seg { display: flex; gap: 4px; flex-wrap: wrap; }

#rw .seg button { font: inherit; font-size: 14.5px; padding: 6px 12px; cursor: pointer; background: var(--panel); color: var(--dim); border: 0; border-bottom: 2px solid var(--rule); }

#rw .seg button:hover { color: var(--bone); }

#rw .seg button[aria-pressed="true"] { background: var(--amber); color: #000; border-bottom-color: var(--amber); }

#rw .streak { display: flex; align-items: baseline; gap: 10px; }

#rw .streak b { font-size: 46px; font-weight: 600; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }

#rw .streak span { font-size: 17px; }

#rw .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 14px; }

#rw .wday { background: var(--panel); border-top: 3px solid var(--rule); padding: 7px 4px; text-align: center; min-width: 0; }

#rw .wday b { display: block; font-size: 13px; font-weight: 600; }

#rw .wday span { display: block; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#rw .wday.s-hit { border-top-color: var(--sage); }

#rw .wday.s-part { border-top-color: var(--amber); }

#rw .wday.s-miss { border-top-color: var(--rust); opacity: .7; }

#rw .wday.s-future, #rw .wday.s-none { opacity: .55; }

#rw .wday.now { box-shadow: inset 0 0 0 1px var(--amber); }

#rw .ratings { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; margin-bottom: 10px; }

#rw .rating { background: var(--panel); padding: 10px 14px; display: flex; flex-direction: column; }

#rw .rating.main { box-shadow: inset 2px 0 0 var(--amber); }

#rw .rating b { font-size: 28px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }

#rw .trend { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }

#rw .trend.up { color: var(--sage); }
 #rw .trend.down { color: var(--rust); }

#rw .wname { font-size: 16.5px; }

#rw .weak .meter { width: 70px; }


/* ---- engine, explorer, review ---- */
#rw .evalbar { position: relative; height: 22px; margin-top: 10px; background: #2a2a2a; box-shadow: 0 0 0 1px var(--rule); overflow: hidden; }

#rw .evalbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #EDEAE2; transition: width .4s; }

#rw .evalbar span { position: absolute; right: 8px; top: 1px; font-size: 13.5px; color: var(--amber); font-variant-numeric: tabular-nums; mix-blend-mode: normal; }

#rw .evtag { font-size: 14.5px; min-width: 4.4em; color: var(--amber); font-variant-numeric: tabular-nums; }

#rw .egraph { display: block; width: 100%; height: 90px; cursor: pointer; margin-top: 6px; }

#rw h2.subhead { font-size: 15px; font-weight: 600; color: var(--dim); margin: 6px 0 -12px; }

/* ---- story ---- */
#rw .story { max-width: 1040px; display: flex; flex-direction: column; gap: 0; }

#rw .story-hero { padding: 8px 0 36px; border-bottom: 1px solid var(--rule); }

#rw .story .eyebrow { margin: 0 0 8px; font-size: 13.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }

#rw .story .big { font-size: clamp(30px, 6vw, 52px); line-height: 1.05; font-weight: 600; margin: 0 0 14px; text-wrap: balance; }

#rw .story .big em { color: var(--amber); font-style: italic; }

#rw .story h3 { font-size: 24px; font-weight: 600; margin: 0 0 10px; text-wrap: balance; }

#rw .story h2 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 0 0 10px; }

#rw .story .lede { font-size: 18.5px; line-height: 1.5; margin: 0 0 12px; max-width: 62ch; }

#rw .story .ask { margin: 0 0 14px; font-size: 15px; color: var(--dim); font-style: italic; max-width: 64ch; line-height: 1.5; }

#rw .traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px 28px; margin: 18px 0 8px; }

#rw .trait { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto auto; gap: 3px 12px; align-items: center; }

#rw .trait .note { grid-row: span 2; font-style: normal; color: var(--bone); font-size: 14.5px; }

#rw .story .meter { display: block; height: 6px; background: var(--rule); }

#rw .story .meter i { display: block; height: 100%; background: var(--amber); }

#rw .story .meter.ghost { height: 3px; }

#rw .story .meter.ghost i { background: var(--dim); }

#rw .story-ch { padding: 34px 0; border-bottom: 1px solid var(--rule); }

#rw .story-ch.last { border-bottom: 0; }

#rw .chno { margin: 0 0 4px; font-size: 15px; font-style: italic; color: var(--amber); }

#rw .scorewrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; margin: 8px 0 18px; }

#rw .scorebig { font-size: 96px; line-height: .9; font-weight: 600; color: var(--amber); font-variant-numeric: tabular-nums; }

#rw .scorebig small { display: block; font-size: 14px; font-weight: 400; color: var(--dim); margin-top: 8px; }

#rw .scoreparts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

#rw .spart { display: flex; flex-direction: column; gap: 4px; }

#rw .spart b { font-variant-numeric: tabular-nums; }

#rw .spark { display: block; width: 100%; height: auto; margin: 6px 0 18px; overflow: visible; }

#rw .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 1px; margin: 4px 0 14px; }

#rw .fact { background: var(--panel); padding: 12px 14px; }

#rw .fact b { display: block; font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }

#rw .fact span { font-size: 13px; color: var(--dim); }

#rw .story .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }

#rw ol.next { margin: 4px 0 20px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; line-height: 1.45; max-width: 64ch; }

@media (max-width: 640px) { #rw .story .two, #rw .scorewrap { grid-template-columns: minmax(0, 1fr); }
 #rw .scorebig { font-size: 72px; }
 }

#rw .tres { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

#rw .tres li { padding-left: 12px; border-left: 2px solid var(--dim); color: var(--bone); overflow-wrap: anywhere; }

#rw .tres li.w { border-left-color: var(--sage); }

#rw .tres li.l { border-left-color: var(--rust); }

#rw .tres-line { margin: 10px 0 0; font-size: 14px; }

#rw .tres-line.w { color: var(--sage); }

#rw .tres-line input { padding: 4px 8px; font-size: 14px; }

<script>
// ---------- Repertoire logic (no DOM) ----------
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const posKey = fen => fen.split(' ').slice(0, 4).join(' ');

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'c' + (h >>> 0).toString(36); }

// A repertoire is Map<positionKey, SAN[]>. Keys are positions, so transpositions share prep.
function repFromEdges(edges) { const m = new Map(); for (const [k, s] of edges || []) { if (!m.has(k)) m.set(k, []); if (!m.get(k).includes(s)) m.get(k).push(s); } return m; }
function repToEdges(rep) { const out = []; for (const [k, list] of reachable(rep)) for (const s of list) out.push([k, s]); return out; }
// Positions reachable from the start; anything orphaned by a removal is dropped on save.
function reachable(rep) {
  const seen = new Map(); const stack = [START_FEN];
  while (stack.length) {
    const fen = stack.pop(); const k = posKey(fen);
    if (seen.has(k)) continue;
    const list = rep.get(k); if (!list || !list.length) continue;
    seen.set(k, list);
    for (const s of list) { const c = new Chess(fen); if (c.move(s)) stack.push(c.fen()); }
  }
  return seen;
}

function splitPgn(text) {
  return text.replace(/\r/g, '').split(/\n\s*\n(?=\[)/).map(t => t.trim()).filter(t => /\d\.\s*\S/.test(t));
}
function parseGame(text, maxPly) {
  const hdr = {}; text.replace(/\[(\w+)\s+"([^"]*)"\]/g, (_, k, v) => { hdr[k] = v; });
  let body = text.replace(/\[[^\]]*\]/g, ' ').replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ');

  // On a 20-minute day, Auto picks a blitz game so the plan fits; a class you chose yourself is kept.
  const short = mins <= 20 && auto && !['blitz', 'bullet', 'daily'].includes(p ? p.main : 'rapid');
  const cls = short ? 'blitz' : !auto ? st.cls : (p ? p.main : 'rapid');
  const tier = tierFor(p && p.elo);
  let theme = weekThemes(weak)[weekdayIdx(date)];
  const tasks = []; let used = 0;
  const add = t => { tasks.push(t); used += t.mins; };
  const left = () => mins - used;
  const top = weak[0];
  const why = key => (weak.find(w => w.key === key) || {}).text;
  const slow = theme === 'slow' || (top && (top.key === 'time' || top.key === 'tilt') && theme === 'play');
  const playKey = slow && !short && cls !== 'daily' && cls !== 'bullet' ? 'slow' : cls;
  const playMins = GAME_MIN[playKey] || 12;
  // Games come first: 3 a day when the time allows them and their reviews, 2 on a normal budget, never fewer than 1.
  // Play day adds one; review day keeps a single game so the habit does not lapse.
  const nGames = theme === 'review' ? 1 : Math.max(1, Math.min(theme === 'play' ? 4 : 3, Math.floor(mins * (theme === 'play' ? 0.9 : 0.75) / (GAME_MIN[playKey] || 12))));
  const reserve = nGames * playMins + (theme === 'play' && playKey !== 'blitz' && playKey !== 'bullet' ? 12 : 0);
  const room = () => left() - reserve;

  if (!ctx.gamesCount) add({ id: 'import', kind: 'setup', title: `Bring in your ${site.name} games`, mins: 3, why: 'The plan is generic until it has your games. Everything after this is tuned to how you actually lose.', action: { type: 'tab', tab: 'games' } });

  // 1. Warm-up: every day.
  const nPuzzles = mins >= 180 ? 30 : mins >= 120 || (theme === 'tactics' && mins >= 60) ? 20 : tier.puzzles;
  const focus = L && ctx.focus && ctx.focus[0];
  add({ id: 'puzzles', kind: 'tactics', title: `Solve ${focus ? Math.min(10, nPuzzles) : nPuzzles} rated puzzles`, mins: focus ? Math.min(10, nPuzzles) : nPuzzles, target: focus ? Math.min(10, nPuzzles) : nPuzzles, why: why('tactics') || 'A daily warm-up keeps pattern recognition sharp. Go for accuracy, not speed.', action: { type: 'url', url: site.puzzles } });
  // Yesterday's review picks a theme: the tactic that cost a game, or the puzzles you keep missing.
  const nTheme = room() >= 15 ? 20 : 10;
  if (focus) add({ id: 'theme', kind: 'tactics', title: `Practice ${nTheme} ${themeName(focus.theme)} puzzles`, mins: nTheme === 20 ? 15 : 8, target: nTheme, theme: focus.theme, why: focus.why, action: { type: 'url', url: `https://lichess.org/training/${focus.theme}` } });

  // 2. Openings: due drills, or starting a repertoire.
  for (const side of ['w', 'b']) {
    if (!ctx.lines[side] && ctx.gamesCount >= 10 && (theme === 'openings' || side === 'w') && room() >= 10) {
      add({ id: 'seed-' + side, kind: 'openings', title: `Choose your first ${side === 'w' ? 'White' : 'Black'} moves`, mins: 10, why: 'In Build, look at what you already play, what the engine likes and what players at your level meet, then save the line you want as your standard.', action: { type: 'seed', side } });
    }
  }
  const dueAll = ctx.due.w + ctx.due.b;
  if (dueAll) {
    const k = Math.min(dueAll, mins <= 20 ? 4 : mins <= 40 ? 6 : mins <= 60 ? 10 : 15);
    add({ id: 'drill', kind: 'openings', title: `Drill ${k} opening line${k > 1 ? 's' : ''}`, mins: Math.ceil(k * 1.2), target: k, why: `${dueAll} line${dueAll > 1 ? 's are' : ' is'} due. Lines you recall every few days hold up under the clock.`, action: { type: 'tab', tab: 'drill', side: ctx.due.w >= ctx.due.b ? 'w' : 'b' } });
  }

  // Threat check: a short blunder-check habit from your own positions, every day.
  if (ctx.threats >= 20 && room() >= 3) add({ id: 'loose', kind: 'tactics', title: 'Loose pieces: 10 positions', mins: 4, target: 10, why: 'Click every undefended piece, pawns included, both sides. Loose pieces are where most tactics start; this is the two-second scan that finds them.', action: { type: 'loose', n: 10 } });
  if (ctx.threats >= 20 && room() >= 8) add({ id: 'threat', kind: 'tactics', title: 'Threat check: 8 positions', mins: 8, target: 8, why: 'Your opponent’s idea in positions from your own games: forks, pins, mating nets and quiet moves that win next move. One question before every move.', action: { type: 'threats', n: 8 } });

  // Your own mistakes, as puzzles: a short set most days, a bigger one on tactics and review days.
  if (ctx.mp && theme !== 'play' && room() >= 5) {
    const k = Math.min(ctx.mp, theme === 'tactics' || theme === 'review' ? 10 : mins <= 20 ? 3 : 5);
    add({ id: 'mp', kind: 'tactics', title: `Fix ${k} of your own mistakes`, mins: Math.ceil(k * 1.5), target: k, why: 'Positions from your games where you went wrong. Find the move you missed; each one comes back until it sticks.', action: { type: 'mistakes' } });
  }

  // 3. The day's theme.
  const gapList = ['w', 'b'].filter(s => ctx.lines[s]).flatMap(s => (ctx.gaps[s] ? ctx.gaps[s].list : []).filter(g => g.type !== 'short' && g.type !== 'dev').map(g => Object.assign({ side: s }, g)));
  const preferSide = weak.find(w => w.key === 'openings')?.side;
  gapList.sort((a, b) => (b.games.length + (b.side === preferSide ? 2 : 0)) - (a.games.length + (a.side === preferSide ? 2 : 0)));
  const gapTask = (g, i) => ({ id: 'gap-' + i, kind: 'openings', title: g.type === 'opp' ? `Prepare your answer to ${lineText(g.path.concat([...g.played.keys()][0]))}` : `Choose your move after ${lineText(g.path)}`, mins: 8, gapKey: g.key, gapSide: g.side,
    why: `You met this in ${g.games.length} game${g.games.length > 1 ? 's' : ''} as ${g.side === 'w' ? 'White' : 'Black'} and scored ${pc(g.scored ? g.points / g.scored : null)}. Pick one sound reply, add it, then drill it.`,
    action: { type: 'gap', side: g.side, path: g.type === 'opp' ? g.path.concat([...g.played.keys()][0]) : g.path } });

  if (theme === 'openings') {
    const n = room() >= 16 ? 2 : 1;
    gapList.slice(0, n).forEach((g, i) => add(gapTask(g, i)));
    if (!gapList.length && ctx.xgaps && ctx.xgaps.length) ctx.xgaps.slice(0, n).forEach((g, i) => add({ id: 'xgap-' + i, kind: 'openings', title: `Prepare your answer to ${lineText(g.path.concat(g.san))}`, mins: 8,
      why: `Players at your level play ${g.san} here ${Math.round(g.share * 100)}% of the time. You will reach this in about ${Math.max(1, Math.round(g.reach * 100))} of every 100 games as ${g.side === 'w' ? 'White' : 'Black'}.`, action: { type: 'gap', side: g.side, path: g.path.concat(g.san) } }));
    if (!gapList.length && !(ctx.xgaps && ctx.xgaps.length) && room() >= 10) add({ id: 'deepen', kind: 'openings', title: `Extend your main line to move ${tier.depth / 2 + 2}`, mins: 10, why: `At your level, aim to know your main lines to about move ${tier.depth / 2 + 2}. Add the most common replies one move deeper.`, action: { type: 'tab', tab: 'build' } });
    if (room() >= 10) add({ id: 'model', kind: 'openings', title: `Model line: ${RUNS[isoWeek(date) % RUNS.length]}`, mins: 10, why: 'Learn what to do after the opening: the plan behind the structure your lines lead to.', action: { type: 'run', name: RUNS[isoWeek(date) % RUNS.length] } });
  } else if (theme === 'tactics') {
    const best = L ? st.storm : st.rush;
    add({ id: 'rush', kind: 'tactics', title: L ? 'Puzzle Storm, 3 minutes' : 'Puzzle Rush, 5 minutes', mins: L ? 4 : 6, why: best ? `Your best is ${best}. Beat it, and ${L ? 'keep your combo going rather than guessing' : 'stop at three misses rather than guessing'}.` : 'Set a baseline today, then try to beat it every tactics day.', action: { type: 'url', url: site.rush } });
    if (room() >= 15) add({ id: 'calc', kind: 'tactics', title: 'Three hard puzzles, slowly', mins: 15, why: 'Calculate the whole line before you touch a piece: checks, captures and threats for both sides. This builds the habit fast puzzles skip.', target: 3, action: { type: 'url', url: site.puzzles } });
  } else if (theme === 'endgames') {
    const wins = (ctx.eg && ctx.eg.wins) || {};
    const next = EG_CHAPTERS.find(([id, , need]) => (wins[id] || 0) < need) || EG_CHAPTERS[EG_CHAPTERS.length - 1];
    egDue(ctx.eg, date).slice(0, 2).forEach((d, i) => add({ id: 'egrev-' + i, kind: 'endgames', title: `Review: ${d.title}`, mins: 8, egId: d.id, why: d.iv ? `You cleared this ${Math.round(d.iv + d.over)} days ago. Solve it twice more so it stays automatic.` : 'You cleared this chapter. Solve it twice more so the technique stays automatic.', action: { type: 'endgame', title: d.title } }));
    add({ id: 'eg', kind: 'endgames', egId: next[0], title: `Endgame: ${next[1]}`, mins: 15, why: (why('endgames') ? why('endgames') + ' ' : '') + `Next on your ladder. Solve it ${next[2]} times to open the next chapter.`, action: { type: 'endgame', title: next[1] } });
    const learned = Object.keys((ctx.eg && ctx.eg.structs) || {}).length;
    if (room() >= 10) add(learned < 13
      ? { id: 'struct', kind: 'endgames', title: 'Pawn structures: learn the next two', mins: 10, why: `A short lesson on each structure's plans, then a quiz. ${learned ? learned + ' of 13 learned so far.' : 'Thirteen structures in all, from the Carlsbad to the Hedgehog.'}`, action: { type: 'run', name: 'Pawn structures' } }
      : { id: 'struct', kind: 'endgames', title: 'Structures quiz', mins: 8, why: 'Eight mixed questions on the structures you have learned: plans, breaks and the pieces that matter.', action: { type: 'run', name: 'Structures quiz' } });
  } else if (theme === 'slow') {
    const lostOnTime = ctx.recentLosses.find(g => g.end === 'time');
    if (lostOnTime) add({ id: 'clock', kind: 'review', title: `Replay your time loss to ${lostOnTime.opp}`, mins: 10, url: lostOnTime.url,
      why: 'Find the two or three moves where you spent the most time. Were they really the critical moments? That is where the clock went.', action: { type: 'review', id: lostOnTime.id, url: lostOnTime.url } });
  } else if (theme === 'review') {
    const losses = ctx.recentLosses.slice(0, Math.max(1, Math.min(3, Math.floor(room() / 10))));
    losses.forEach((g, i) => add({ id: 'review-' + i, kind: 'review', title: `Review your loss to ${g.opp}`, mins: 10, url: g.url,
      why: `Find the move where the game turned. Was it the opening, a tactic, or the clock? Write one sentence about it. (${g.date}, ${g.plies ? Math.ceil(g.plies / 2) + ' moves' : ''}${g.end === 'time' ? ', lost on time' : ''})`,
      action: { type: 'review', id: g.id, url: g.url } }));
    if (!losses.length) add({ id: 'review-x', kind: 'review', title: 'Review your last game', mins: 10, why: 'Find the move where the game turned, and write one sentence about it.', action: { type: 'url', url: site.archive(st.lichessUser) } });
    add({ id: 'import-week', kind: 'setup', title: 'Import this week’s games', mins: 3, why: 'Next week’s plan and gap report should see this week’s games.', action: { type: 'tab', tab: 'games' } });
    if (left() >= 10) add({ id: 'model', kind: 'openings', title: `Model line: ${RUNS[isoWeek(date) % RUNS.length]}`, mins: 10, why: 'An easier finish to the week: learn the plan behind a structure.', action: { type: 'run', name: RUNS[isoWeek(date) % RUNS.length] } });
  }

  // A learned endgame that is due comes back on other days too, when there is room.
  if (theme !== 'endgames' && theme !== 'play') { const d = egDue(ctx.eg, date)[0]; if (d && room() >= 8) add({ id: 'egrev-0', kind: 'endgames', title: `Review: ${d.title}`, mins: 8, egId: d.id, why: d.iv ? `You cleared this ${Math.round(d.iv + d.over)} days ago. A short review keeps the technique automatic.` : 'You cleared this chapter. A short review keeps the technique automatic.', action: { type: 'endgame', title: d.title } }); }
  // Long days (2 and 3 hours): deeper work on top of the day's theme, best first, while it fits.
  if (mins >= 120) {
    const has = id => tasks.some(t => t.id === id);
    const wins = (ctx.eg && ctx.eg.wins) || {};
    const next = EG_CHAPTERS.find(([id, , need]) => (wins[id] || 0) < need) || EG_CHAPTERS[EG_CHAPTERS.length - 1];
    const learned = Object.keys((ctx.eg && ctx.eg.structs) || {}).length;
    const run = RUNS[isoWeek(date) % RUNS.length];
    const extras = [
      { id: 'selfan', kind: 'review', title: 'Analyse a game of yours before the engine', mins: 20, why: 'Pick one of today’s or yesterday’s games. Write down where you think it turned and what you should have played, then check with Stockfish. Comparing your notes to the engine is how your own judgement improves.', action: { type: 'url', url: site.archive(st.lichessUser) } },
      { id: 'calc', kind: 'tactics', title: 'Three hard puzzles, slowly', mins: 15, target: 3, why: 'Calculate the whole line before you touch a piece: checks, captures and threats for both sides.', action: { type: 'url', url: site.puzzles } },
      { id: 'eg', kind: 'endgames', egId: next[0], title: `Endgame: ${next[1]}`, mins: 15, why: `Next on your ladder. Solve it ${next[2]} times to open the next chapter.`, action: { type: 'endgame', title: next[1] } },
      learned < 13 ? { id: 'struct', kind: 'endgames', title: 'Pawn structures: learn the next two', mins: 10, why: `A short lesson on each structure's plans, then a quiz. ${learned ? learned + ' of 13 learned so far.' : ''}`, action: { type: 'run', name: 'Pawn structures' } }
        : { id: 'struct', kind: 'endgames', title: 'Structures quiz', mins: 8, why: 'Eight mixed questions on the structures you have learned.', action: { type: 'run', name: 'Structures quiz' } },
      { id: 'model', kind: 'openings', title: `Model line: ${run}`, mins: 10, why: 'Learn what to do after the opening: the plan behind the structure your lines lead to.', action: { type: 'run', name: run } },
      { id: 'rush', kind: 'tactics', title: L ? 'Puzzle Storm, 3 minutes' : 'Puzzle Rush, 5 minutes', mins: L ? 4 : 6, why: 'Fast pattern recognition to finish a long session.', action: { type: 'url', url: site.rush } },
    ];
    if (mins >= 180) extras.push({ id: 'selfan2', kind: 'review', title: 'Analyse a second game, then compare', mins: 20, why: 'Same method on another game. Look for the same kind of mistake in both: that is your next thing to train.', action: { type: 'url', url: site.archive(st.lichessUser) } });
    for (const t of extras) if (!has(t.id) && room() >= t.mins) add(t);
  }

  // 4. Play, every day.
  {
    const n = nGames;
    const intent = slow ? (top && top.key === 'tilt' ? 'Stop for the day after two losses in a row. ' : '') + 'Keep at least a third of your clock at move 20 and spend it on the critical moments.'
      : theme === 'openings' && tasks.some(t => t.kind === 'openings') ? 'Steer for the lines you worked on today, and check afterwards where you left your prep.'
      : theme === 'tactics' ? 'Before every move: checks, captures, threats, for both sides.'
      : theme === 'endgames' ? 'If it goes long, trade into an endgame you know instead of avoiding one.'
      : 'Afterwards, import the games so the gap report sees them.';
    const label = playKey === 'slow' ? 'rapid' : playKey;
    add({ id: 'play', kind: 'play', title: `Play ${n} ${label} game${n > 1 ? 's' : ''} (${TC[playKey] || ''})`, mins: n * playMins, target: n, cls: label, why: intent + (n > 1 ? ' After each game, spend 3 minutes finding the move where it turned before starting the next.' : ' Afterwards, spend 3 minutes finding the move where it turned.'), action: { type: 'url', url: site.play } });
    // Once a week, on play day, a blitz game: quick decisions and practical play under the clock.
    if (theme === 'play' && playKey !== 'blitz' && playKey !== 'bullet') add({ id: 'blitz', kind: 'play', title: 'Play 1 blitz game (5|0)', mins: 12, target: 1, cls: 'blitz', why: 'Your weekly blitz game. Trust your first instinct when it is sound, and notice where the clock pushed you into a quick mistake.', action: { type: 'url', url: site.play } });
  }

  const focusNote = {
    openings: 'Today is about your openings: fix the line you keep running into, then drill it.',
    tactics: 'Today is about tactics: volume first, then a few puzzles calculated slowly.',
    endgames: 'Today is about endgames: technique you can trust when the game goes long.',
    slow: 'Today is about the clock and your decisions: one slower game, played well.',
    play: 'Today is a play day: more games, with a quick check of every loss.',
    review: 'Today is a review day: learn from this week’s losses and reset for next week.',
  }[theme];
  const reason = top && FOCUS_THEME[top.key] === theme ? ' ' + top.text : '';
  const fromReview = focus ? ` Yesterday’s review picked ${themeName(focus.theme)} as today’s focus: see the ${(tasks.find(t => t.id === 'theme') || {}).target || 20}-puzzle task.` : '';
  // Fit the time you chose: drop the lowest-priority tasks (added last) until it fits.
  // The game, the review's focus task and setup stay; with no focus task, the puzzle warm-up stays.
  // From 40 minutes, the day's own work stays too: the first task of the day's theme.
  const dayKind = { openings: 'openings', endgames: 'endgames', review: 'review', slow: 'review', tactics: 'tactics', play: 'play' }[theme];
  const dayTask = mins >= 40 ? tasks.find(t => t.kind === dayKind && !['play', 'puzzles', 'theme'].includes(t.id)) : null;
  const keep = t => t === dayTask || t.id === 'play' || t.id === 'import' || t.id === 'theme' || (t.id === 'puzzles' && !tasks.some(x => x.id === 'theme'));
  while (used > mins + 2) {
    let i = tasks.length - 1; while (i >= 0 && keep(tasks[i])) i--;
    if (i < 0) break;
    used -= tasks[i].mins; tasks.splice(i, 1);
  }
  const over = used > mins + 2 ? ` Today runs about ${used} minutes: a ${playMins}-minute game plus the must-do tasks don’t fit in ${mins}, so everything else was left out.${mins <= 20 && !auto ? ' Set Games to play to Auto and a 20-minute day uses one blitz game instead.' : ''}` : short ? ' A short day, so today’s game is blitz.' : '';
  return { date: ymd(date), theme, title: THEME[theme], note: focusNote + reason + fromReview + over, tier: tier.name, tierNote: tier.note, cls, mins, total: used, tasks };
}
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

</script>
<script>
// ---------- Repertoire app ----------
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const PIECE = {
    k:  // king
      "<path d=\"M46 6 h8 v8 h8 v7 h-8 v9 h-8 v-9 h-8 v-7 h8 z\"/>" +

      "<circle cx=\"65\" cy=\"24\" r=\"5\"/>" +
      "<circle cx=\"78\" cy=\"29\" r=\"5\"/>" +
      "<path d=\"M28 62 h44 c1 8 3 13 6 16 h-56 c3 -3 5 -8 6 -16 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    r:  // rook
      "<path d=\"M25 22 h11 v9 h9 v-9 h10 v9 h9 v-9 h11 v22 h-50 z\"/>" +
      "<path d=\"M31 46 h38 l-3 26 h-32 z\"/>" +
      "<path d=\"M26 74 h48 v7 h-48 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    b:  // bishop
      "<circle cx=\"50\" cy=\"22\" r=\"4.5\"/>" +
      "<path d=\"M50 27 c-11 6 -17 15 -17 23 c0 6 4 11 9 13 h16 c5 -2 9 -7 9 -13 c0 -8 -6 -18 -17 -24 z\"/>" +
      "<path d=\"M43 55 l14 -21 l5 3 l-14 21 z\" class=\"detail\"/>" +
      "<path d=\"M34 63 h32 c1 7 4 13 8 18 h-48 c4 -5 7 -11 8 -18 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    n:  // knight
      "<path d=\"M60 16 l8 12 c8 10 10 24 10 53 h-42 c0 -16 4 -26 12 -34 l-10 4 c-6 2 -11 -1 -12 -6 c-1 -6 3 -10 8 -14 l14 -10 l4 -9 z\"/>" +
      "<circle cx=\"57\" cy=\"34\" r=\"3.5\" class=\"detail\"/>" +
      "<path d=\"M33 40 l9 -3 l-2 6 z\" class=\"detail\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
    p:  // pawn
      "<circle cx=\"50\" cy=\"36\" r=\"12\"/>" +
      "<path d=\"M40 48 h20 l-3 6 c6 9 9 18 10 27 h-34 c1 -9 4 -18 10 -27 z\"/>" +
      "<path d=\"M22 88 h56 v-7 q0 -4 -5 -5 h-46 q-5 1 -5 5 z\"/>",
  };
const pct = (pts, n) => n ? Math.round(100 * pts / n) + '%' : 'n/a';
const sideName = s => s === 'w' ? 'White' : 'Black';
const lineText = path => path.map((s, i) => (i % 2 === 0 ? (i / 2 + 1) + '.' : '') + s).join(' ') || 'the start';

const S = {
  side: 'w', tab: 'today',
  settings: { mins: 40, cls: 'auto', rush: null }, plans: {}, stats: null,
  rep: { w: new Map(), b: new Map() }, draft: { w: new Map(), b: new Map() },
  games: [], username: '', cards: {},
  path: [], game: new Chess(), sel: null, hint: null,
  drill: null, mp: null, th: null, lp: null, drillMode: 'lines', store: 'loading', batch: false, review: null, xgaps: { w: null, b: null }, checks: {},
};
let db = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }

const LS = { get(k) { try { return JSON.parse(localStorage.getItem('reps:' + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem('reps:' + k, JSON.stringify(v)); } catch {} } };
const DOCS = { 'rep-w': 'rep/white', 'rep-b': 'rep/black', cards: 'drill/stats', settings: 'settings/main' };
const timers = {};

// ---------- Derived state ----------
let D = { idx: new Map(), gaps: { list: [], games: 0, avgBook: 0, early: 0 }, ends: [], lines: [], due: [] };
const lineId = l => hashStr(S.side + ':' + l.join(' '));

// Ratings differ between sites, so the profile reads the main site's games when there are enough.

function mySite() {
  const want = onLichess() ? 'lichess' : 'chesscom', other = want === 'lichess' ? 'chesscom' : 'lichess';

}
function myGames() { const site = mySite(); return S.games.filter(g => srcOf(g) === site).sort((a, b) => gameTime(a) - gameTime(b)).slice(-SAMPLE); }

// ---------- Drill (same rules as the model-line trainer) ----------
function startDrill(pool) {
  if (!pool.length) return toast('No lines to drill yet. Build some first.');
  const queue = pool.slice().sort((a, b) => ((S.cards[lineId(a)] || {}).due || 0) - ((S.cards[lineId(b)] || {}).due || 0));
  S.drill = { queue, i: 0, done: false, tally: { clean: 0, missed: 0 }, results: [] };
  loadLine();
}
function loadLine() {
  const d = S.drill; const line = d.queue[d.i];
  if (!line) { d.done = true; render(); return; }
  Object.assign(d, { line, ply: 0, game: new Chess(), wrong: 0, mistakes: 0, sheet: [], note: null, busy: false, finished: false });
  S.hint = null; S.sel = null; render(); autoReply();
}
function autoReply() {
  const d = S.drill;
  if (d.ply >= d.line.length) return finishLine();
  if (d.game.turn() === S.side) return;
  d.busy = true;
  setTimeout(() => {
    if (S.drill !== d) return;
    const san = d.line[d.ply]; d.game.move(san); d.sheet.push({ san, ann: null }); d.ply++; d.busy = false;
    if (d.ply >= d.line.length) finishLine(); else render();
  }, 620);
}
function drillMove(san) {
  const d = S.drill; const want = d.line[d.ply];
  if (san === want) {
    d.game.move(san); d.sheet.push({ san, ann: d.wrong ? 'slow' : 'best' }); d.ply++; d.wrong = 0; S.hint = null;
    d.note = null; render(); autoReply(); return;
  }
  const alt = (S.rep[S.side].get(posKey(d.game.fen())) || []).includes(san);
  if (alt) { d.note = { cls: 'miss', text: `${san} is in your prep too, but this line goes the other way. Find the other move.` }; render(); return; }
  d.wrong++; if (d.wrong === 1) d.mistakes++;
  if (d.wrong >= 2) { const m = new Chess(d.game.fen()).move(want); S.hint = m ? { from: m.from, to: m.to } : null; }
  d.note = { cls: 'miss', text: d.wrong >= 2 ? `Still not it. Your prep plays ${want}.` : 'That is legal, but it is not your prep. Think about what you decided here.' };
  render();
}
function showMove() {
  const d = S.drill; const m = new Chess(d.game.fen()).move(d.line[d.ply]); if (!m) return;
  S.hint = { from: m.from, to: m.to }; if (!d.wrong) d.mistakes++; d.wrong = Math.max(d.wrong, 2);
  d.note = { cls: 'miss', text: `Play ${d.line[d.ply]}.` }; render();
}
function finishLine() {
  const d = S.drill; if (d.finished) return; d.finished = true;
  const id = lineId(d.line); S.cards[id] = schedule(S.cards[id], d.mistakes, Date.now()); save('cards');
  d.tally[d.mistakes ? 'missed' : 'clean']++; d.results.push({ label: lineText(d.line), good: !d.mistakes });
  const iv = S.cards[id].iv;
  d.note = d.mistakes ? { cls: 'bad', text: `Line done, with ${d.mistakes} slip${d.mistakes > 1 ? 's' : ''}. It comes back in 10 minutes.` }
    : { cls: 'payoff', text: `Clean. You will see this line again in ${iv < 2 ? '1 day' : Math.round(iv) + ' days'}.` };
  refresh(); render();
}

// ---------- Your mistakes as puzzles ----------
// Every serious mistake the engine found in your games becomes a "find the better move" position,
// on the same spaced schedule as opening lines: clean solves come back later, misses come back soon.
let MP_CACHE = null;
function mistakePuzzles() {
  let n = 0; try { for (let i = 0; i < localStorage.length; i++) if (localStorage.key(i).startsWith('reps:review:')) n++; } catch {}
  const key = n + ':' + S.games.length;
  if (MP_CACHE && MP_CACHE.key === key) return MP_CACHE.list;
  const list = [];
  for (const R of storedReviews()) for (const m of reviewMistakes(R)) {
    // Skip positions that were already lost, or still clearly won after the slip: nothing to learn there.
    if (!m.serious || !m.best || m.before < -300 || m.after >= 400) continue;
    list.push({ id: R.g.id + ':' + m.i, g: R.g, i: m.i, sans: R.sans, san: m.san, best: m.best, before: m.before, after: m.after, loss: m.loss, drop: m.drop, reply: R.best[m.i + 1] });
  }
  MP_CACHE = { key, list }; return list;
}
const mpCards = () => LS.get('mp-cards') || {};
function mpDue() {
  const cards = mpCards(), now = Date.now();
  const all = mistakePuzzles();
  const due = all.filter(p => cards[p.id] && cards[p.id].due <= now).sort((a, b) => cards[a.id].due - cards[b.id].due);
  const fresh = all.filter(p => !cards[p.id]).sort((a, b) => gameTime(b.g) - gameTime(a.g) || b.drop - a.drop);
  return due.concat(fresh);
}
const mpSolvedToday = () => Object.values(mpCards()).filter(c => c.last >= dayStart()).length;

function startMp(pool) {
  if (!pool.length) return toast('No mistakes to practise yet. Scan some games first.');
  S.mp = { queue: pool.slice(0, 20), i: 0, done: false, tally: { clean: 0, missed: 0 } };
  loadMp();
}
function loadMp() {
  const d = S.mp; const p = d.queue[d.i];
  if (!p) { d.done = true; render(); return; }
  const game = new Chess(); for (const s of p.sans.slice(0, p.i)) game.move(s);
  Object.assign(d, { p, game, wrong: 0, mistakes: 0, finished: false, checking: false, note: null, played: null });
  S.hint = null; S.sel = null; render();
}
async function mpMove(san) {
  const d = S.mp; const p = d.p; const fen = d.game.fen();
  const good = () => { d.game.move(san); d.played = san; finishMp(san === p.best ? null : san); };
  if (san === p.best) return good();
  if (san !== p.san && engineReady()) {
    // Another move can be just as good. Ask the engine before calling it wrong.
    d.checking = true; d.note = { cls: '', text: `Checking ${san}…` }; render();
    const c = new Chess(fen); c.move(san);
    const a = c.game_over() ? null : await analyze(c.fen(), { depth: 12 });
    d.checking = false; if (S.mp !== d) return;
    const sg = p.g.me === 'w' ? 1 : -1;
    const ev = c.in_checkmate() ? 10000 * sg : a && !a.cancelled ? evalNum(a.lines[0]) : null;
    if (ev != null && sg * clampE(ev) >= p.before - 60) return good();
  }
  d.wrong++; if (d.wrong === 1) d.mistakes++;
  if (d.wrong >= 2) { const m = new Chess(fen).move(p.best, { sloppy: true }); S.hint = m ? { from: m.from, to: m.to } : null; }
  d.note = { cls: 'miss', text: san === p.san ? `That is what you played in the game${p.reply ? `, and ${p.reply} punished it` : ''}. Look again.` : d.wrong >= 2 ? 'Still not it. The highlighted piece has the move.' : 'Not quite. Checks, captures and threats first, for both sides.' };
  render();
}
function showMp() {
  const d = S.mp; const m = new Chess(d.game.fen()).move(d.p.best, { sloppy: true }); if (!m) return;
  S.hint = { from: m.from, to: m.to }; if (!d.wrong) d.mistakes++; d.wrong = Math.max(d.wrong, 2);
  d.note = { cls: 'miss', text: `The move was ${d.p.best}. Play it to continue.` }; render();
}
function finishMp(alt) {
  const d = S.mp; if (d.finished) return; d.finished = true; S.hint = null;
  const cards = mpCards(); cards[d.p.id] = schedule(cards[d.p.id], d.mistakes, Date.now()); LS.set('mp-cards', cards);
  d.tally[d.mistakes ? 'missed' : 'clean']++;
  const iv = cards[d.p.id].iv;
  d.note = d.mistakes ? { cls: 'bad', text: `Found it with help. In the game you played ${d.p.san}. This one comes back in 10 minutes.` }
    : { cls: 'payoff', text: `${alt ? alt + ' works too; the engine’s first choice was ' + d.p.best + '.' : 'That’s it.'} In the game you played ${d.p.san}. Next review in ${iv < 2 ? '1 day' : Math.round(iv) + ' days'}.` };

}

// ---------- Progress over time ----------
const weekStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return +d; };
// One row per week for the last n weeks: games, score, rating, accuracy, mistakes, puzzles.
function weeklySeries(n) {
  const games = S.games.filter(g => srcOf(g) === mySite());
  const cls = (D.profile && D.profile.main) || 'rapid';
  const rev = new Map(storedReviews().map(R => [R.g.id, R]));
  const H = LS.get('li-days') || {};
  const w0 = weekStart(Date.now()); const rows = [];
  for (let k = n - 1; k >= 0; k--) {
    const a = new Date(w0); a.setDate(a.getDate() - 7 * k); const b = new Date(a); b.setDate(b.getDate() + 7);
    const gs = games.filter(g => gameTime(g) >= +a && gameTime(g) < +b).sort((x, y) => gameTime(x) - gameTime(y));
    const rated = gs.filter(g => g.cls === cls && g.myElo); const rs = gs.map(g => rev.get(g.id)).filter(Boolean);
    const accs = rs.map(gameAccuracy).filter(x => x != null);
    let pz = 0, pw = 0; for (const d = new Date(a); d < b; d.setDate(d.getDate() + 1)) { const x = H[ymd(d)]; if (x && x.puzzles) { pz += x.puzzles; pw += x.won || 0; } }
    rows.push({ start: +a, label: a.toLocaleDateString('en', { month: 'short', day: 'numeric' }), games: gs.length,
      score: gs.length ? gs.reduce((s, g) => s + g.score, 0) / gs.length : null,
      rating: rated.length ? rated[rated.length - 1].myElo : null,
      accuracy: accs.length ? accs.reduce((s, x) => s + x, 0) / accs.length : null, checked: rs.length,
      mistakes: rs.length ? rs.reduce((s, R) => s + reviewMistakes(R).filter(m => m.serious).length, 0) / rs.length : null,
      puzzles: pz || null, puzzleWin: pz ? pw / pz : null });
  }
  return { rows, cls };
}

  const W = 320, H = 96, P = 8, B = 18; const n = rows.length; const vals = rows.map(r => r[key]);

  var PKEY = "endgame-reps-progress";

  function absorb(raw) {
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data && data.wins) {                     // current shape
      S.wins = Object.assign(S.wins, data.wins);
      if (data.level) S.level = data.level;
      if (data.reps !== undefined) S.reps = data.reps;
      if (data.freeAll) S.freeAll = true;
      if (data.seen) S.seen = data.seen;
      if (data.structs) S.structs = data.structs;
      if (data.runs) S.runs = data.runs;
    } else {                                     // saved before levels existed
      S.wins = Object.assign(S.wins, data);
    }
  }

  function loadProgress() {
    if (window.storage) {
      return window.storage.get(PKEY).then(function (r) {
        if (r && r.value) absorb(r.value);
      }).catch(function () {});
    }
    try { absorb(window.localStorage.getItem(PKEY)); }
    catch (e) { /* storage unavailable; nothing will persist */ }
    return Promise.resolve();
  }

  function saveProgress() {
    var blob = JSON.stringify({ wins: S.wins, level: S.level, reps: S.reps,
                            freeAll: S.freeAll, seen: S.seen, structs: S.structs, runs: S.runs });
    if (window.storage) { window.storage.set(PKEY, blob).catch(function () {}); return; }
    try { window.localStorage.setItem(PKEY, blob); } catch (e) {}
  }

     calls "Rxd1" a win like any other, so free material has to be filtered
     out here: neither side may be able to snap something off for nothing. */
  function quietPosition(board, stm) {
    var them = stm === "w" ? "b" : "w", i, hit;

    var ours = legalMoves({ b: board, stm: stm, cast: "", ep: -1 });
    for (i = 0; i < ours.length; i++) {
      hit = board[ours[i].to];
      if (!hit) continue;
      if (PVAL[hit.toLowerCase()] >= 3) return false;                 // a piece hangs
      if (!squareAttacked(board, ours[i].to, them)) return false;     // a loose pawn
    }

    var theirs = legalMoves({ b: board, stm: them, cast: "", ep: -1 });
    for (i = 0; i < theirs.length; i++) {
      hit = board[theirs[i].to];
      if (!hit) continue;
      if (!squareAttacked(board, theirs[i].to, stm)) return false;    // ours hangs to the reply
    }
    return true;
  }

    if (!board) return false;
    var wk = board.indexOf("K"), bk = board.indexOf("k");
    if (wk < 0 || bk < 0 || adjacent(wk, bk)) return false;
    // Whoever is not to move cannot already be in check.
    return !inCheck(board, stm === "w" ? "b" : "w");

    var tries = 0, relax = 0, lv = currentLevel(), accept = acceptFor(ch, lv, 0);
    function attempt() {
      if (gen !== S.gen) throw new Error("superseded");   // don't keep hitting the API
      if (++tries > 90) throw new Error("no position after 90 tries");
      if (tries === 20 || tries === 45) {                 // nothing this strict exists here
        accept = acceptFor(ch, lv, ++relax);
        veil(true, "Widening the search\u2026");
      } else if (tries % 15 === 0) {
        veil(true, "Still searching\u2026");
      }
      var board = ch.place();
      if (!legalSetup(board, ch.stm)) return attempt();
      if (!quietPosition(board, ch.stm)) return attempt();
      return probe(toFen(board, ch.stm)).then(function (d) {
        if (!accept(d, board)) return attempt();
        return { board: board, data: d };
      }).catch(function (e) {
        // A 404 just means an illegal or out-of-table position; try another.
        if (String(e.message).indexOf("tablebase ") === 0) return attempt();
        throw e;
      });
    }
    return attempt();
  }

  // The API orders moves by DTZ, which is not always the fastest mate. For a
  // trainer, "quickest" should mean distance to mate, so pick that out ourselves.
  function speed(m) {
    if (m.dtm != null) return Math.abs(m.dtm);
    if (m.dtz != null) return Math.abs(m.dtz);
    return 0;
  }
  function fastestOf(moves) {
    var top = moves[0];
    var pool = moves.filter(function (m) { return norm(m.category) === norm(top.category); });
    if (!pool.length) return top;
    return pool.reduce(function (a, b) { return speed(b) < speed(a) ? b : a; }, pool[0]);
  }

  function play(mv) {
    var ch = S.ch, lv = currentLevel();
    var before = S.stm === ch.user ? norm(S.tb.category) : flip(norm(S.tb.category));
    var after = outcomeForMover(mv);
    var best = fastestOf(S.tb.moves);
    var kind, glyph, note;

    if (before === "loss") {
      // Nothing left to save. Grading a move here as "best" would be praise for
      // playing on in a position that was already gone.
      kind = "gone"; glyph = "";
      note = "The position was already lost.";
    } else if (rank(after) < rank(before)) {
      kind = "bad"; glyph = "\u2049";
      note = "That throws away the " + (before === "win" ? "win" : "draw") +
             ". " + best.san + " kept it.";
    } else if (after === "win" && speed(mv) > speed(best)) {
      kind = "slow"; glyph = "?!";
      note = "Still winning, but slow. " + best.san + " was quicker.";
    } else {
      kind = "best"; glyph = "!";
      note = S.hinted ? "Correct." : "Best move.";
    }

    S.snapshot = { board: S.board.slice(), stm: S.stm, tb: S.tb, len: S.history.length,
                   from: S.lastFrom, to: S.lastTo };

    // Throwing the result away ends the drill at every level. There is nothing
    // left to practise; the levels differ only in whether you may take it back.
    S.lostIt = (kind === "bad");

    el.verdict.textContent = note;
    el.verdict.className = "verdict " + kind;
    if (glyph) stamp(kind === "bad" ? "bad" : kind, kind === "bad" ? "??" : glyph);
    el.btnBack.hidden = (kind === "best") || !lv.takeback;

    commit(mv, kind);
  }

  function commit(mv, kind) {
    var gen = S.gen;
    S.busy = true; S.sel = null;
    if (mv.uci.length > 4) S.promoted = true;
    S.lastFrom = sqIndex(mv.uci.slice(0, 2));
    S.lastTo = sqIndex(mv.uci.slice(2, 4));
    S.board = applyUci(S.board, S.stm, mv.uci);
    S.stm = S.stm === "w" ? "b" : "w";
    S.history.push({ san: mv.san, ann: kind, by: S.ch.user });
    render(); renderSheet();

    probe(toFen(S.board, S.stm)).then(function (d) {
      if (gen !== S.gen) return;
      S.tb = d;
      if (S.lostIt) { endBlunder(); return; }
      if (finished(d)) return;
      setTimeout(function () { if (gen === S.gen) reply(); }, 480);
    }).catch(function (e) { if (gen === S.gen) fail(e); });
  }

  // At the top two levels a single bad move ends the drill there and then.
  // Called the moment the result is thrown away.
  function endBlunder() {
    S.lostIt = false; S.over = true; S.busy = false;
    var lv = currentLevel();
    el.prompt.textContent = (S.ch.goal === "draw" ? "The draw is gone." : "The win is gone.") +
      (lv.takeback ? " Take it back, or start a new position."
                   : " No take-backs at this level.");
    el.btnBack.hidden = !lv.takeback;
    render();
    runRecord(false);
  }

  /* ---------- how the opponent chooses ----------
     It is tablebase-perfect on the result and never blunders one away. But
     "perfect" usually leaves several moves tied, and how that tie is broken
     is the whole difference between looking sharp and looking aimless.      */
  function opponentMove(d, board, stm) {
    var moves = d.moves;
    var goal = outcomeForMover(moves[0]);          // the best result available to it
    var pool = moves.filter(function (m) { return outcomeForMover(m) === goal; });

    if (goal === "loss") {
      // Lost anyway, so drag the mate out as long as possible. This must use
      // distance to mate; the API orders by DTZ, which is a different thing.
      var slowest = pool.reduce(function (a, b) { return speed(b) > speed(a) ? b : a; }, pool[0]);
      pool = pool.filter(function (m) { return speed(m) === speed(slowest); });
    } else if (goal === "win") {
      var quickest = pool.reduce(function (a, b) { return speed(b) < speed(a) ? b : a; }, pool[0]);
      pool = pool.filter(function (m) { return speed(m) === speed(quickest); });
    } else if (pool.length > 1) {
      // Every move draws, so the tablebase has no opinion at all. Left to pick at
      // random it just shuffles. Push the pawn and walk at the enemy king instead,
      // so the defence actually gets tested.
      var foeKing = board.indexOf(stm === "w" ? "k" : "K");
      var top = [], bestScore = -Infinity;
      pool.forEach(function (m) {
        var from = sqIndex(m.uci.slice(0, 2)), to = sqIndex(m.uci.slice(2, 4));
        var piece = board[from] || "";
        var score = 0;
        if (piece.toLowerCase() === "p") score += 10;      // progress
        if (m.zeroing) score += 4;
        if (foeKing >= 0) score -= cheb(to, foeKing);      // close the distance
        if (score > bestScore) { bestScore = score; top = [m]; }
        else if (score === bestScore) top.push(m);
      });
      pool = top;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function reply() {
    var gen = S.gen, d = S.tb;
    if (!d.moves || !d.moves.length) { finished(d); return; }
    var mv = opponentMove(d, S.board, S.stm);

    S.lastFrom = sqIndex(mv.uci.slice(0, 2));
    S.lastTo = sqIndex(mv.uci.slice(2, 4));
    S.board = applyUci(S.board, S.stm, mv.uci);
    S.stm = S.stm === "w" ? "b" : "w";
    S.history.push({ san: mv.san, ann: null, by: S.ch.user === "w" ? "b" : "w" });
    render(); renderSheet();

    probe(toFen(S.board, S.stm)).then(function (d2) {
      if (gen !== S.gen) return;
      S.tb = d2;
      if (finished(d2)) return;
      S.busy = false; S.hinted = false; S.hintLevel = 0;
      el.btnBack.hidden = true;
      render();
    }).catch(function (e) { if (gen === S.gen) fail(e); });
  }

  // For "stop" chapters: the threat is gone only when the pawn is captured, not
  // when it promotes. A pawn that queens leaves the board too, so check both.
  function enemyThreatLeft() {
    var pawn = S.ch.user === "w" ? "p" : "P";
    var queen = S.ch.user === "w" ? "q" : "Q";
    return S.board.indexOf(pawn) !== -1 || S.board.indexOf(queen) !== -1;
  }

  function finished(d) {
    var ch = S.ch, msg = null, good = false;
    var mine = S.stm === ch.user ? norm(d.category) : flip(norm(d.category));

    if (d.checkmate) {
      good = S.stm !== ch.user;                       // the side to move is the one mated
      msg = good ? "Mate. Chapter complete." : "You were mated.";
    } else if (d.stalemate) {
      good = ch.goal === "draw";
      msg = good ? "Stalemate. The draw holds." : "Stalemate \u2014 the win is gone.";
    } else if (d.insufficient_material) {
      good = ch.goal === "draw" || ch.goal === "stop";
      msg = good ? "Nothing left to play for. Held." : "No mating material left.";
    } else if (ch.goal === "promote" && S.promoted) {
      good = mine === "win";
      msg = good ? "Queened, and still winning. That's the technique."
                 : "You queened, but the win had already gone.";
    } else if (ch.goal === "stop" && !enemyThreatLeft()) {
      good = mine !== "loss";
      msg = good ? "Threat gone." : "Pawn stopped, but the position is lost.";
    } else if (ch.goal === "draw" && S.history.length >= 28) {
      good = mine !== "loss";
      msg = good ? "Held. There's nothing left for the other side." : "The position is lost.";
    }

    if (!msg) return false;

    S.over = true; S.busy = false;
    el.prompt.textContent = msg;
    el.verdict.textContent = good ? "Press New position for another." : "Press New position to try again.";
    el.verdict.className = "verdict " + (good ? "done" : "bad");
    el.btnBack.hidden = true;
    if (good) {
      S.wins[ch.id] = (S.wins[ch.id] || 0) + 1;
      // Once a chapter is cleared, each new day's solve doubles the gap before it comes back.
      var sr = S.seen[ch.id] || {}, now = Date.now(); sr.lastWin = now; S.seen[ch.id] = sr;
      if (S.wins[ch.id] >= ch.needed) {
        if (!sr.last) sr.iv = 2;
        else if (now - sr.last > 12 * 3600e3) sr.iv = Math.min(45, Math.max(2, (sr.iv || 1) * 2));
        sr.last = now; S.seen[ch.id] = sr;
      }
      saveProgress();
    }
    renderChapters(); render();
    runRecord(good);
    return true;
  }

  function fail(err) {
    S.busy = false; S.over = true; S.sel = null;
    el.verdict.textContent = "Lost contact with the tablebase (" + err.message +
      "). Press New position to restart this drill.";
    el.verdict.className = "verdict bad";
    render();
  }

  function takeBack() {
    if (!S.snapshot) return;
    var s = S.snapshot;
    S.gen++;                         // kill the opponent reply already queued for this move
    S.board = s.board; S.stm = s.stm; S.tb = s.tb;
    S.history = S.history.slice(0, s.len);
    S.lastFrom = s.from; S.lastTo = s.to;
    S.snapshot = null; S.busy = false; S.over = false; S.sel = null;
    S.hintLevel = 0; S.hinted = false;
    el.btnBack.hidden = true;
    el.verdict.textContent = "Taken back. Try again.";
    el.verdict.className = "verdict";
    render(); renderSheet();
  }

  // How many moves keep the current result? Move categories are stated from the
  // opponent's seat, so anything matching the best move's category is equally good.
  function movesThatHold(tb) {
    var best = norm(tb.moves[0].category);
    return tb.moves.filter(function (m) { return norm(m.category) === best; }).length;
  }

  function adviceFor(ch, tb) {
    var bits = [ch.advice];
    var mine = norm(tb.category);
    var n = movesThatHold(tb);

    if (mine === "win") {
      bits.push(n === 1
        ? "Exactly one move keeps the win here."
        : n + " moves keep the win, though only some are quickest.");
    } else if (mine === "draw") {
      bits.push(n === 1
        ? "Exactly one move holds the draw here."
        : n + " moves hold the draw here.");
    }

    // Warn about stalemate only where it would be a disaster, not where it's the goal.
    if (ch.goal !== "draw" && tb.moves.some(function (m) { return m.stalemate; })) {
      bits.push("Careful \u2014 one of your moves is stalemate.");
    }
    return bits.join(" ");
  }

  function updateHintButton() {
    if (!currentLevel().hints) {
      el.btnHint.textContent = "Hints off"; el.btnHint.disabled = true; return;
    }
    if (S.hintLevel >= 2) { el.btnHint.textContent = "Move shown"; el.btnHint.disabled = true; return; }
    el.btnHint.disabled = S.busy || S.over || !S.tb;
    el.btnHint.textContent = S.hintLevel === 0 ? "Hint" : "Show the move";
  }

  function hint() {
    if (S.mode !== "drill" || !S.tb || !S.tb.moves || !S.tb.moves.length) return;
    if (S.busy || S.over || S.hintLevel >= 2 || !currentLevel().hints) return;

    S.hintLevel++;
    if (S.hintLevel === 1) {
      el.verdict.textContent = adviceFor(S.ch, S.tb);
      el.verdict.className = "verdict tip";
    } else {
      S.hinted = true;                       // only the move itself counts as being told
      S.hintsUsed++;
      el.verdict.textContent = "Play " + fastestOf(S.tb.moves).san + ".";
      el.verdict.className = "verdict slow";
    }
    updateHintButton();
  }
