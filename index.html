  function linesFor(structureName) {
    return LINES.filter(function (l) { return l.structure === structureName; });
  }

  /* ---------- guided line play ---------- */
  var L = null;   // { line, pos, i, wrong, sel }

  function startLines(ids) {
    RUN = { set: { name: "The minority attack", kind: "line", lines: ids },
            i: 0, results: [], started: Date.now() };
    loadLine(0);
  }

  function loadLine(idx) {
    var id = RUN.set.lines[idx];
    var line = LINES.filter(function (x) { return x.id === id; })[0];
    S.gen++;
    setMode("line");
    L = { line: line, pos: parsePos(line.fen), i: 0, wrong: 0 };
    L.you = L.pos.stm;
    S.board = L.pos.b; S.ch = null; S.tb = null; S.sel = null;
    S.lastFrom = S.lastTo = null; S.history = [];
    renderRunbar();
    el.lname.textContent = line.title;
    el.lsetup.textContent = line.setup;
    el.lnote.textContent = "";
    el.lnote.className = "lnote";
    el.btnLineHint.disabled = false;
    el.btnLineHint.textContent = "Show the move";
    renderSheet(); render();
    lineAsk();
  }

  function lineAsk() {
    if (!L.line.moves[L.i]) return;
    el.lprompt.textContent = (L.you === "w" ? "White" : "Black") +
                             " to play. Find the plan move.";
  }

  function lineClick(sq) {
    if (S.mode !== "line" || !L || L.done) return;
    var legal = legalMoves(L.pos);
    if (L.sel !== null && L.sel !== undefined) {
      var picked = legal.filter(function (m) {
        return m.from === L.sel && m.to === sq;
      });
      if (picked.length) { tryLineMove(picked[0]); return; }
    }
    L.sel = ownedBy(L.pos.b[sq], L.pos.stm) ? sq : null;
    render();
  }

  function tryLineMove(mv) {
    var want = L.line.moves[L.i];
    var got = moveUci(mv);
    // Accept any promotion spelling if the line's move is not a promotion.
    if (got !== want.uci && got.slice(0, 4) !== want.uci.slice(0, 4)) {
      L.wrong++;
      L.sel = null;
      el.lnote.className = "lnote miss";
      el.lnote.textContent = L.wrong >= 2
        ? "Still not it. The plan move is " + want.san + "."
        : "That is legal, but it is not the plan. Think about which pawn has to move, and why.";
      render();
      return;
    }
    playLineMove(want, mv);
  }

  function playLineMove(entry, mv) {
    L.pos = makeMove(L.pos, mv);
    S.board = L.pos.b;
    S.lastFrom = mv.from; S.lastTo = mv.to;
    S.history.push({ san: entry.san, ann: L.wrong ? "slow" : "best", by: L.you });
    L.sel = null; L.wrong = 0;
    el.lnote.className = "lnote";
    el.lnote.textContent = entry.note || "";
    L.i++;
    renderSheet(); render();

    if (entry.last || L.i >= L.line.moves.length) { finishLine(); return; }

    // Black answers with the line's reply.
    var reply = L.line.moves[L.i];
    setTimeout(function () {
      if (S.mode !== "line" || !L) return;
      var legal = legalMoves(L.pos);
      var m = legal.filter(function (x) { return moveUci(x) === reply.uci; })[0];
      if (!m) { el.lprompt.textContent = "This line is broken at " + reply.san + "."; return; }
      L.pos = makeMove(L.pos, m);
      S.board = L.pos.b;
      S.lastFrom = m.from; S.lastTo = m.to;
      S.history.push({ san: reply.san, ann: null, by: L.you === "w" ? "b" : "w" });
      L.i++;
      renderSheet(); render(); lineAsk();
    }, 620);
  }

  function finishLine() {
    L.done = true;
    el.lprompt.textContent = "Plan complete.";
    el.lnote.className = "lnote payoff";
    el.lnote.textContent = L.line.payoff;
    var clean = S.history.every(function (h) { return h.ann !== "slow"; });
    RUN.results[RUN.i] = { label: L.line.title, good: clean, tally: null };
    el.btnLineHint.disabled = true;
    el.btnLineNext.hidden = false;
    el.btnLineNext.textContent =
      (RUN.i + 1 >= RUN.set.lines.length) ? "See how you did" : "Next line";
    render();
  }

  function nextLine() {
    el.btnLineNext.hidden = true;
    if (RUN.i + 1 >= RUN.set.lines.length) { showSummary(); return; }
    RUN.i++;
    loadLine(RUN.i);
  }

  function lineHint() {
    if (!L || L.done) return;
    var want = L.line.moves[L.i];
    el.lnote.className = "lnote miss";
    el.lnote.textContent = "Play " + want.san + ".";
    L.wrong = Math.max(L.wrong, 1);
    el.btnLineHint.disabled = true;
  }

  /* ---------- mode switching ---------- */
  function setMode(m) {
    S.mode = m;
    el.boardwrap.hidden = (m === "summary");
    el.statusbar.hidden = (m !== "drill");
    el.controls.hidden = (m !== "drill");
    el.study.hidden = (m !== "study");
    el.linepanel.hidden = (m !== "line");
    el.summary.hidden = (m !== "summary");
  }

  /* ---------- run state ---------- */
  var RUN = null;

  function startRun(set) {
    RUN = { set: set, i: 0, results: [], started: Date.now(), order: null, queue: set.kind === "study" ? studyQueue(set) : null };
    renderRunbar();
    if (set.kind === "study") { showQuestion(); return; }
    if (set.kind === "line") { startLines(set.lines); return; }
    setMode("drill");                      // we may be arriving from a summary or a study run
    S.ch = chapterById(set.drills[0]);
    newPosition();
  }

  function renderRunbar() {
    if (!RUN) { el.runbar.hidden = true; return; }
    el.runbar.hidden = false;
    el.runname.textContent = RUN.set.name;
    if (RUN.set.endless) {
      el.runcount.textContent = "position " + (RUN.i + 1);
      el.btnQuit.textContent = "Finish";
      return;
    }
    var total = RUN.set.kind === "study" ? RUN.queue.length
              : RUN.set.kind === "line" ? RUN.set.lines.length
              : RUN.set.drills.length;
    el.runcount.textContent = (RUN.i + 1) + " of " + total;
    el.btnQuit.textContent = "Leave run";
  }

  function quitRun() {
    RUN = null; L = null;
    S.gen++;                               // drop anything the run had in flight
    el.runbar.hidden = true;
    setMode("drill");
    S.ch = null; S.tb = null; S.board = new Array(64).fill(null);
    S.history = []; S.sel = null; S.lastFrom = S.lastTo = null;
    S.busy = false; S.over = false;
    el.prompt.textContent = "Pick a chapter or a run to begin.";
    el.verdict.textContent = ""; el.verdict.className = "verdict";
    el.btnBack.hidden = true;
    veil(false);
    renderChapters(); renderSheet(); render();
  }

  // Called by finished() once a drill resolves.
  function runRecord(good) {
    if (!RUN || RUN.set.kind === "study" || RUN.set.kind === "line") return;
    var run = RUN;                         // so a mid-timeout run change can't advance the wrong one
    var solo = run.set.kind === "solo";
    var tally = { best: 0, slow: 0, bad: 0, hints: S.hintsUsed };
    S.history.forEach(function (m) { if (m.ann && tally[m.ann] !== undefined) tally[m.ann]++; });
    run.results[run.i] = { label: solo ? "Rep " + (run.i + 1) : S.ch.title,
                           good: good, tally: tally };
    if (!good) return;                     // stay put; New position retries this one

    if (solo) {
      if (run.set.reps && run.i + 1 >= run.set.reps) {
        setTimeout(function () { if (RUN === run) showSummary(); }, 1400);
        return;
      }
      setTimeout(function () {
        if (RUN !== run) return;
        run.i++;
        renderRunbar();
        newPosition();                     // same chapter, fresh position
      }, 1400);
      return;
    }
    if (run.i + 1 >= run.set.drills.length) {
      setTimeout(function () { if (RUN === run) showSummary(); }, 1400);
      return;
    }
    setTimeout(function () {
      if (RUN !== run) return;
      run.i++;
      renderRunbar();
      S.ch = chapterById(run.set.drills[run.i]);
      newPosition();
    }, 1400);
  }

  /* ---------- study mode ----------
     The course takes two structures at a time, lesson first, then its questions,
     and finishes with a couple of review questions from ones already learned.
     The quiz mixes questions from everything learned so far.                 */
  function shuffled(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function studyQueue(set) {
    var learned = STRUCTURES.filter(function (x) { return S.structs[x.name]; });
    var qOf = function (st) { return st.qs.map(function (q) { return { kind: "q", s: st, q: q }; }); };
    if (set.quiz) {
      var pool = (learned.length >= 3 ? learned : STRUCTURES).reduce(function (a, st) { return a.concat(qOf(st)); }, []);
      return shuffled(pool).slice(0, 8);
    }
    // New structures first, in order; then the ones you scored worst on, longest ago.
    var score = function (st) { var r = S.structs[st.name]; return r ? (r.right / Math.max(1, r.n)) * 10 + (r.last / 864e5) / 1e6 : -1; };
    var next = STRUCTURES.filter(function (x) { return !S.structs[x.name]; });
    if (next.length < 2) next = next.concat(learned.slice().sort(function (a, b) { return score(a) - score(b); }));
    next = next.slice(0, 2);
    var out = [];
    next.forEach(function (st) { out.push({ kind: "lesson", s: st }); out = out.concat(qOf(st)); });
    var rest = learned.filter(function (x) { return next.indexOf(x) < 0; });
    shuffled(rest).slice(0, 2).forEach(function (st) { out.push({ kind: "q", s: st, q: st.qs[Math.floor(Math.random() * st.qs.length)], review: true }); });
    return out;
  }
  function showQuestion() {
    var item = RUN.queue[RUN.i], st = item.s;
    S.gen++;                                   // cancel anything the last drill has in flight
    setMode("study");
    veil(false);
    S.board = fromFen(st.fen);
    S.ch = null; S.sel = null; S.tb = null;
    S.lastFrom = S.lastTo = null; S.history = [];
    render(); renderSheet();
    renderRunbar();

    el.qtitle.textContent = (item.review ? "Review: " : "") + st.name;
    el.btnPlayPlan.hidden = true;
    el.opts.innerHTML = "";

    if (item.kind === "lesson") {
      var L = st.lesson;
      el.qask.textContent = st.from + ".";
      el.whytext.innerHTML = '<span class="lsn"><b>The idea.</b> ' + L.idea + '</span>' +
        '<span class="lsn"><b>White’s plan.</b> ' + L.white + '</span>' +
        '<span class="lsn"><b>Black’s plan.</b> ' + L.black + '</span>' +
        '<span class="lsn"><b>Watch for.</b> ' + L.watch + '</span>';
      el.why.hidden = false;
      el.btnNextQ.textContent = "Quiz me on it";
      var avail = linesFor(st.name);
      el.btnPlayPlan.hidden = avail.length === 0;
      if (avail.length) el.btnPlayPlan.textContent = "Watch the plan (" + avail.length + " lines)";
      return;
    }
    var q = item.q;
    el.qask.textContent = q.ask;
    el.why.hidden = true;

    // Shuffle, or the correct answer's position becomes the answer.
    var order = shuffled(q.options.map(function (_, i) { return i; }));
    RUN.order = order;

    order.forEach(function (orig) {
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = q.options[orig];
      b.addEventListener("click", function () { answerQuestion(orig); });
      el.opts.appendChild(b);
    });
  }

  function answerQuestion(picked) {
    var item = RUN.queue[RUN.i], q = item.q, order = RUN.order;
    var buttons = el.opts.querySelectorAll(".opt");
    for (var slot = 0; slot < buttons.length; slot++) {
      buttons[slot].disabled = true;
      var orig = order[slot];
      if (orig === q.answer) buttons[slot].className = "opt right";
      else if (orig === picked) buttons[slot].className = "opt wrong";
    }
    var good = picked === q.answer;
    RUN.results.push({ label: (item.review ? "Review: " : "") + item.s.name, good: good, tally: null });
    var r = S.structs[item.s.name] || (S.structs[item.s.name] = { n: 0, right: 0, last: 0 });
    r.n++; if (good) r.right++; r.last = Date.now(); saveProgress();
    el.whytext.textContent = q.why;
    el.why.hidden = false;
    el.btnNextQ.textContent = (RUN.i + 1 >= RUN.queue.length) ? "See how you did" : "Next";

    var avail = linesFor(item.s.name);
    el.btnPlayPlan.hidden = avail.length === 0;
    if (avail.length) {
      el.btnPlayPlan.textContent = "Play the plan (" + avail.length + " lines)";
    }
  }

  function nextQuestion() {
    if (RUN.i + 1 >= RUN.queue.length) return showSummary();
    RUN.i++;
    showQuestion();
  }

  /* ---------- summary ---------- */
  function showSummary() {
    if (!RUN) return;
    S.runs[RUN.set.name] = Date.now(); saveProgress(); renderRuns();
    setMode("summary");
    var clean = 0;
    el.sumtitle.textContent = RUN.set.name;
    el.sumlist.innerHTML = "";
    RUN.results.forEach(function (r) {
      var li = document.createElement("li");
      var name = document.createElement("span");
      name.textContent = r.label;
      var mark = document.createElement("span");
      if (r.tally) {
        var bits = [];
        if (r.tally.best) bits.push('<span class="ann best">!</span>\u00d7' + r.tally.best);
        if (r.tally.slow) bits.push('<span class="ann slow">?!</span>\u00d7' + r.tally.slow);
        if (r.tally.bad) bits.push('<span class="ann bad">??</span>\u00d7' + r.tally.bad);
        if (r.tally.hints) bits.push('<span class="dimmed">' + r.tally.hints + " shown</span>");
        mark.innerHTML = bits.join("  ") || "\u2014";
        if (!r.tally.bad && !r.tally.slow && !r.tally.hints) clean++;
      } else {
        mark.innerHTML = r.good
          ? '<span class="ann best">right</span>'
          : '<span class="ann bad">wrong</span>';
        if (r.good) clean++;
      }
      li.appendChild(name); li.appendChild(mark);
      el.sumlist.appendChild(li);
    });
    var mins = Math.max(1, Math.round((Date.now() - RUN.started) / 60000));
    var lv = currentLevel();
    if (RUN.set.solo) el.sumtitle.textContent = RUN.set.name + ", " + RUN.results.length +
      (RUN.results.length === 1 ? " position" : " positions");
    el.sumtime.textContent = clean + " of " + RUN.results.length +
      " clean, in about " + mins + (mins === 1 ? " minute" : " minutes") +
      (RUN.set.kind === "study" || RUN.set.kind === "line"
        ? "." : ", at level " + lv.n + " (" + lv.name + ").");
  }

  /* ---------- interaction ---------- */
  function isUsers(piece) {
    if (!piece) return false;
    return (piece === piece.toUpperCase()) === (S.ch.user === "w");
  }

  function onSquare(sq) {
    if (S.mode !== "drill" || !S.ch) return;
    if (!S.tb || S.busy || S.over || S.stm !== S.ch.user) return;
    var legal = S.tb.moves || [];
    if (S.sel !== null) {
      var matches = legal.filter(function (m) {
        return sqIndex(m.uci.slice(0, 2)) === S.sel && sqIndex(m.uci.slice(2, 4)) === sq;
      });
      if (matches.length === 1) return play(matches[0]);
      if (matches.length > 1) return askPromotion(matches);
    }
    S.sel = isUsers(S.board[sq]) ? sq : null;
    render();
  }

  function askPromotion(matches) {
    el.promorow.innerHTML = "";
    matches.forEach(function (m) {
      var letter = m.uci[4] || "q";
      var b = document.createElement("button");
      b.title = m.san;
      b.appendChild(pieceEl(S.ch.user === "w" ? letter.toUpperCase() : letter));
      b.addEventListener("click", function () { el.promo.hidden = true; play(m); });
      el.promorow.appendChild(b);
    });
    el.promo.hidden = false;
  }

  /* ---------- rendering ---------- */
  function pieceEl(p) {
    var d = document.createElement("div");
    d.className = "piece " + (p === p.toUpperCase() ? "w" : "b");
    d.innerHTML = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
                  "<g>" + PIECE[p.toLowerCase()] + "</g></svg>";
    return d;
  }

  function render() {
    var live = S.mode === "drill" && !!S.ch;
    var online = S.mode === "line" && !!L && !L.done;
    var flipBoard = (live && S.ch.user === "b") || (online && L.you === "b");
    var sel = online ? L.sel : S.sel;
    var targets = [];

    if (live && S.sel !== null) {
      targets = ((S.tb && S.tb.moves) || [])
        .filter(function (m) { return sqIndex(m.uci.slice(0, 2)) === S.sel; })
        .map(function (m) { return sqIndex(m.uci.slice(2, 4)); });
    } else if (online && sel !== null && sel !== undefined) {
      targets = legalMoves(L.pos)
        .filter(function (m) { return m.from === sel; })
        .map(function (m) { return m.to; });
    }

    el.board.innerHTML = "";
    for (var n = 0; n < 64; n++) {
      var i = flipBoard ? 63 - n : n;
      var d = document.createElement("div");
      var light = (((i >> 3) + (i % 8)) % 2) === 0;
      d.className = "sq " + (light ? "light" : "dark");
      if (i === S.lastFrom) d.className += " from";
      if (i === S.lastTo) d.className += " to";
      if (i === sel) d.className += " sel";
      if (targets.indexOf(i) !== -1) d.className += " target" + (S.board && S.board[i] ? " occupied" : "");

      var p = S.board ? S.board[i] : null;
      if (p) {
        d.appendChild(pieceEl(p));
        if (live && isUsers(p) && !S.busy && !S.over && S.stm === S.ch.user) d.className += " pickable";
        if (online && ownedBy(p, L.pos.stm)) d.className += " pickable";
      }
      if ((live || online) && targets.indexOf(i) !== -1) d.className += " pickable";

      if (n >= 56 || n % 8 === 7) {
        var c = document.createElement("span");
        c.className = "coord";
        c.textContent = sqName(i);
        d.appendChild(c);
      }
      (function (idx) {
        d.addEventListener("click", function () {
          if (S.mode === "line") lineClick(idx); else onSquare(idx);
        });
      })(i);
      el.board.appendChild(d);
    }
    updateHintButton();
  }

  function renderLevels() {
    el.levels.innerHTML = "";
    var h = document.createElement("h2");
    h.className = "grouphead";
    h.textContent = "Difficulty";
    el.levels.appendChild(h);

    var row = document.createElement("div");
    row.className = "levelrow";
    LEVELS.forEach(function (lv) {
      var b = document.createElement("button");
      b.className = "lvl" + (lv.n === S.level ? " on" : "");
      b.textContent = lv.n;
      b.title = lv.name;
      b.addEventListener("click", function () { setLevel(lv.n); });
      row.appendChild(b);
    });
    el.levels.appendChild(row);

    var p = document.createElement("p");
    p.className = "lvlname";
    p.innerHTML = "<strong>" + currentLevel().name + "</strong><br>" + currentLevel().blurb;
    el.levels.appendChild(p);
  }

  var REPS = [1, 3, 5, 10, 0];             // 0 means keep going until you leave




  function renderReps() {
    el.repsbox.innerHTML = "";
    var h = document.createElement("h2");
    h.className = "grouphead";
    h.textContent = "Repeats";
    el.repsbox.appendChild(h);

    var row = document.createElement("div");
    row.className = "levelrow";
    REPS.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "lvl" + (n === S.reps ? " on" : "");
      b.textContent = n === 0 ? "\u221e" : String(n);
      b.title = n === 0 ? "Keep going until you stop" : n + " in a row";
      b.addEventListener("click", function () { setReps(n); });
      row.appendChild(b);
    });
    el.repsbox.appendChild(row);

    var p = document.createElement("p");
    p.className = "lvlname";
    p.textContent = S.reps === 0
      ? "Pick a chapter below and it repeats until you stop."
      : S.reps === 1
        ? "Pick a chapter below for one position at a time."
        : "Pick a chapter below and it repeats " + S.reps + " times.";
    el.repsbox.appendChild(p);
  }

  function renderRuns() {
    el.runs.innerHTML = "";
    var h = document.createElement("h2");
    h.className = "grouphead";
    h.textContent = "Runs";
    el.runs.appendChild(h);
    SETS.forEach(function (set) {
      var b = document.createElement("button");
      b.className = "run";
      var count = set.kind === "study" ? 0
                : set.kind === "line" ? set.lines.length : set.drills.length;
      var learned = STRUCTURES.filter(function (x) { return S.structs[x.name]; }).length;
      b.innerHTML = '<div class="name">' + set.name + '</div>' +
                    '<div class="meta">' + set.blurb + (set.kind === "study"
                      ? ", " + learned + " of " + STRUCTURES.length + " learned"
                      : ", " + count + " in a row") + "</div>";
      b.addEventListener("click", function () { startRun(set); });
      el.runs.appendChild(b);
    });
  }

  var DAY = 864e5;
  function dueList() {
    var now = Date.now();
    return CHAPTERS.filter(function (c) {
      if ((S.wins[c.id] || 0) < c.needed) return false;
      var r = S.seen[c.id]; return !r || !r.last || now - r.last >= (r.iv || 2) * DAY;
    });
  }
  function chapterButton(ch, i, opts) {
    var open = unlocked(i), done = S.wins[ch.id] || 0, cleared = done >= ch.needed;
    var b = document.createElement("button");
    b.className = "chapter" + (open ? "" : " locked") + (S.ch === ch ? " on" : "") + (cleared ? " cleared" : "");
    b.disabled = !open;
    var chip, sub;
    if (opts && opts.due) { chip = '<span class="chip due">Review</span>'; sub = ch.material; }
    else if (!open) {
      var prev = CHAPTERS[i - 1], left = prev.needed - (S.wins[prev.id] || 0);
      chip = '<span class="chip lock">Locked</span>';
      sub = "Opens after " + left + " more " + prev.title.replace(/^The /, "").toLowerCase() + (left === 1 ? "" : "s");
    } else if (cleared) {
      var r = S.seen[ch.id], next = r && r.last ? Math.max(0, Math.ceil((r.last + (r.iv || 2) * DAY - Date.now()) / DAY)) : 0;
      chip = '<span class="chip ok">✓ Cleared</span>'; sub = next ? "Next review in " + next + (next === 1 ? " day" : " days") : "Due for review";
    } else { chip = '<span class="chip">' + done + " / " + ch.needed + "</span>"; sub = ch.material; }
    var pctDone = Math.min(100, Math.round(100 * done / ch.needed));
    b.innerHTML = '<div class="crow"><span class="num">' + (i + 1) + '</span><span class="name">' + ch.title + '</span>' + chip + '</div>' +
                  '<div class="meta">' + sub + '</div>' +
                  (open && !cleared ? '<div class="pbar"><i style="width:' + pctDone + '%"></i></div>' : '');
    if (open) b.addEventListener("click", function () { startChapter(ch); });
    return b;
  }
  function renderChapters() {
    var cleared = CHAPTERS.filter(function (c) { return (S.wins[c.id] || 0) >= c.needed; }).length;
    var due = dueList();
    if (el.eghead) el.eghead.innerHTML =
      '<div><p class="egeyebrow">Endgames &amp; structures</p><h2 class="egtitle">' +
      (due.length ? due.length + (due.length === 1 ? " chapter is" : " chapters are") + " due for review" : cleared ? "You are up to date" : "Start with the queen mate") + '</h2>' +
      '<p class="egsub">Cleared chapters come back after 2, 4, 8 days and so on, so the technique stays automatic. Your daily plan brings them in too.</p></div>' +
      '<div class="egstats"><div><b>' + cleared + '<small> / ' + CHAPTERS.length + '</small></b><span>chapters cleared</span></div><div><b>' + due.length + '</b><span>due today</span></div></div>';

    el.chapters.innerHTML = "";
    if (due.length) {
      var dh = document.createElement("h2"); dh.className = "grouphead due"; dh.textContent = "Due for review";
      el.chapters.appendChild(dh);
      due.forEach(function (ch) { el.chapters.appendChild(chapterButton(ch, CHAPTERS.indexOf(ch), { due: true })); });
    }
    var lastGroup = null;
    CHAPTERS.forEach(function (ch, i) {
      if (ch.group !== lastGroup) {
        lastGroup = ch.group;
        var h = document.createElement("h2");
        h.className = "grouphead";
        h.textContent = ch.group;
        el.chapters.appendChild(h);
      }
      el.chapters.appendChild(chapterButton(ch, i));
    });
    if (!S.freeAll && CHAPTERS.some(function (c, i) { return !unlocked(i); })) {
      var free = document.createElement("button");
      free.className = "unlockall";
      free.textContent = "Unlock every chapter";
      free.title = "Skip the ladder and drill anything you like";
      free.addEventListener("click", unlockAll);
      el.chapters.appendChild(free);
    }
  }

  function renderSheet() {
    el.moves.innerHTML = "";
    el.sheetEmpty.hidden = S.history.length > 0;
    var whiteFirst = (S.mode === "line" && L) ? L.you === "w"
                   : (S.ch ? S.ch.stm === "w" : true);
    var cells = S.history.slice();
    if (!whiteFirst) cells.unshift(null);
    for (var i = 0; i < cells.length; i += 2) {
      var li = document.createElement("li");
      var no = document.createElement("span");
      no.className = "no"; no.textContent = (i / 2 + 1) + ".";
      li.appendChild(no);
      [cells[i], cells[i + 1]].forEach(function (m) {
        var s = document.createElement("span");
        if (m) {
          s.textContent = m.san;
          if (m.ann) {
            var a = document.createElement("span");
            a.className = "ann " + m.ann;
            a.textContent = m.ann === "best" ? "!"
                          : m.ann === "slow" ? "?!"
                          : m.ann === "gone" ? "\u00b7" : "??";
            s.appendChild(a);
          }
        } else { s.textContent = "\u2026"; }
        li.appendChild(s);
      });
      el.moves.appendChild(li);
    }
  }


  function setReps(n) {
    if (n === S.reps) return;
    S.reps = n;
    saveProgress();
    renderReps();
  }

  // Picking one chapter drills that chapter, repeatedly. Handing the run engine a
  // list that is the same chapter N times means the counter, auto-advance and
  // summary all work with no special cases.
  function startChapter(ch, reps) {
    reps = (reps === undefined) ? S.reps : reps;
    RUN = null;
    setMode("drill");
    S.ch = ch;

    if (reps === 1) { el.runbar.hidden = true; newPosition(); return; }

    var endless = (reps === 0), list = [];
    for (var i = 0; i < (endless ? 1 : reps); i++) list.push(ch.id);
    RUN = { set: { id: "solo:" + ch.id, name: ch.title, kind: "solo",
                   drills: list, endless: endless, solo: true },
            i: 0, results: [], started: Date.now() };
    renderRunbar();
    newPosition();
  }

  function unlockAll() {
    S.freeAll = true;
    saveProgress();
    renderChapters();
  }


  el.btnNew.addEventListener("click", function () {
    if (!S.ch) S.ch = CHAPTERS[0];
    setMode("drill");
    newPosition();
  });
  el.btnHint.addEventListener("click", hint);
  el.btnBack.addEventListener("click", takeBack);
  el.btnQuit.addEventListener("click", function () {
    if (RUN && RUN.set.endless && RUN.results.length) showSummary(); else quitRun();
  });
  el.btnNextQ.addEventListener("click", nextQuestion);
  el.btnDone.addEventListener("click", quitRun);
  el.btnLineHint.addEventListener("click", lineHint);
  el.btnLineNext.addEventListener("click", nextLine);
  el.btnPlayPlan.addEventListener("click", function () {
    var q = RUN.queue[RUN.i].s;
    var ids = linesFor(q.name).map(function (l) { return l.id; });
    if (ids.length) startLines(ids);
  });
  el.promo.addEventListener("click", function (e) {
    if (e.target === el.promo) el.promo.hidden = true;
  });

  loadProgress().then(function () {
    renderLevels(); renderReps(); renderRuns(); renderChapters(); renderSheet(); render();
    setMode("drill");
    startChapter(CHAPTERS[0], 1);
  });
})();
</script>
